name: Build develop.uganda V251 PRO CAM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V251-PRO-CAM.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout full repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install workflow replay helper
      run: python3 -m pip install --quiet pyyaml

    - name: Replay verified V250 PRO CAM3 source pipeline
      run: |
        set -e
        python3 - <<'PY2'
        from pathlib import Path
        import os
        import subprocess
        import yaml

        root = Path.cwd()
        source = root / ".github/workflows/V250-PRO-CAM3.yml"
        if not source.exists():
            raise SystemExit("V250 PRO CAM3 workflow is missing")

        data = yaml.safe_load(source.read_text(encoding="utf-8"))
        steps = data["jobs"]["build"]["steps"]

        replayed = 0
        for step in steps:
            name = str(step.get("name", ""))
            if name == "Set up Java 17":
                break

            command = step.get("run")
            if not command:
                continue

            cwd = root
            working = step.get("working-directory")
            if working:
                cwd = root / working

            env = os.environ.copy()
            for key, value in (step.get("env") or {}).items():
                env[str(key)] = str(value)

            print(f"REPLAY: {name}", flush=True)
            subprocess.run(
                ["bash", "-lc", command],
                cwd=str(cwd),
                env=env,
                check=True,
            )
            replayed += 1

        if replayed < 3:
            raise SystemExit(f"Unexpectedly replayed only {replayed} CAM3 run steps")

        print(f"PASS: replayed {replayed} verified V250 PRO CAM3 source steps.")
        PY2

    - name: Apply V251 PRO ASSIST ENGINE
      run: |
        set -e
        echo '' | base64 -d > /tmp/v251_pro_assist_patch.py
        python3 -m py_compile /tmp/v251_pro_assist_patch.py
        python3 /tmp/v251_pro_assist_patch.py

        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        DIRECTOR="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDirectorOverlayView.kt"
        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V251 PRO CAM' "$CAMERA"
        grep -q 'v251CleanMasterRecord' "$CAMERA"
        grep -q 'v251ApplyPrimaryFaceMetering' "$CAMERA"
        grep -q 'FocusMeteringAction.FLAG_AE' "$CAMERA"
        grep -q 'CLEAN MASTER ON' "$CAMERA"
        grep -q 'setPrimaryFaceListener' "$DIRECTOR"
        grep -q 'primaryFaceListener?.invoke' "$DIRECTOR"
        grep -q 'V251 • PRO ASSIST ENGINE' "$PRO"
        grep -q 'FACE EXPOSURE PRIORITY' "$PRO"
        grep -q 'CLEAN MASTER RECORD' "$PRO"
        grep -q 'V251 • PRO CAM' "$PANEL"
        grep -q 'develop.uganda • V251 PRO CAM' "$HOME"
        grep -q 'versionCode = 25100' "$GRADLE"
        grep -q 'versionName = "251.0-pro-assist"' "$GRADLE"

        # Protected V238/V250 systems must remain intact.
        grep -q 'v249ToggleReporterTags' "$CAMERA"
        grep -q 'smoothZoomToTarget' "$PRO"
        grep -q 'v248ShutterTag' "$CAMERA"
        grep -q 'v247ApplyAdaptiveDetail' "$CAMERA"
        grep -q 'v246ApplyCinemaImageEngine' "$CAMERA"
        grep -q 'v245MasterQualityStatus' "$CAMERA"
        grep -q 'verifyV242GalleryMaster' "$CAMERA"
        grep -q 'identityRow.visibility = View.GONE' "$CAMERA"

        echo "PASS: V251 PRO CAM verified before Android compilation."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V251 PRO CAM APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v251-pro-cam-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v251-pro-cam-build.log | head -5000 || true

    - name: Prepare V251 PRO CAM artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V251-PRO-CAM.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V251-PRO-CAM-SOURCE.zip app -x 'app/build/*'
        cd ..

    - name: Upload V251 PRO CAM APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V251-PRO-CAM
        path: DEVELOP-UGANDA-V251-PRO-CAM.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload V251 PRO CAM source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V251-PRO-CAM-SOURCE
        path: DEVELOP-UGANDA-V251-PRO-CAM-SOURCE.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload V251 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V251-PRO-CAM-BUILD-LOG
        path: v172-source/v251-pro-cam-build.log
        if-no-files-found: warn
        retention-days: 7
