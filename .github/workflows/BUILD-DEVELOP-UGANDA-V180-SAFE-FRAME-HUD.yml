name: Build develop.uganda V180 Safe Frame HUD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V180 source
        run: |
          set -e
          test -f DevelopUgandaCameraActivityV180.kt
          test -d v172-source
          echo "V180 source found"

      - name: Install V180 direct source
        run: |
          set -e

          cp DevelopUgandaCameraActivityV180.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("v172-source/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 18000',
              text,
              count=1
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "180.0-safe-frame-hud"',
              text,
              count=1
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify V180 safe layout
        run: |
          set -e
          FILE="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"

          grep -q 'finalWidth \* 0.19f' "$FILE"
          grep -q 'finalWidth \* 0.43f' "$FILE"
          grep -q 'finalWidth \* 0.69f' "$FILE"
          grep -q '39f \* u' "$FILE"
          grep -q 'REPORT ID $reportId • CLIP' "$FILE"
          grep -q 'REPORTER ${reporterDisplayName()} • STORY' "$FILE"
          grep -q 'sceneTag()' "$FILE"
          grep -q 'makeRecordButton' "$FILE"

          echo "V180 safe-frame layout verified"

      - name: Commit V180 source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V180 source already committed"
          else
            git commit -m "Fix V180 safe-frame brand and compass layout"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V180 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v180-build.log

      - name: Print exact error context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v180-build.log \
            | head -300 \
            || true

          echo "===== SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v180-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )
          m = re.search(
              r'DevelopUgandaCameraActivity\.kt:(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          line_no = int(m.group(1))
          src = Path(
              "app/src/main/java/com/sentongoharuna/pulse/"
              "DevelopUgandaCameraActivity.kt"
          )
          lines = src.read_text(encoding="utf-8").splitlines()

          for n in range(
              max(1, line_no - 10),
              min(len(lines), line_no + 14) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V180-SAFE-FRAME-HUD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V180-SAFE-FRAME-HUD
          path: DEVELOP-UGANDA-V180-SAFE-FRAME-HUD.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V180-BUILD-LOG
          path: v172-source/v180-build.log
          if-no-files-found: warn
          retention-days: 7
