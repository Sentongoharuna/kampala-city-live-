name: Build develop.uganda V270 FINAL CLEAN BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V270-FINAL-BUILD.yml'

permissions:
  contents: read

jobs:
  build_v270:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore V270 source from build pack
        shell: bash
        run: |
          set -euo pipefail
          PACK='.github/workflows/DEVELOP-UGANDA-V270-PRO-CAM-BUILD-PACK.zip'
          test -f "$PACK" || { echo "Missing $PACK"; exit 1; }
          rm -rf /tmp/v270pack v172-source
          mkdir -p /tmp/v270pack v172-source
          unzip -q "$PACK" -d /tmp/v270pack
          test -f /tmp/v270pack/DEVELOP-UGANDA-V270-PRO-CAM-SOURCE.zip
          unzip -q /tmp/v270pack/DEVELOP-UGANDA-V270-PRO-CAM-SOURCE.zip -d v172-source
          grep -q 'versionCode = 27000' v172-source/app/build.gradle.kts
          grep -q 'versionName = "270.0-guided-workflow-verified-actions"' v172-source/app/build.gradle.kts
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV270Guidance.kt
          echo 'PASS: V270 source restored.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V270 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v270-build.log

      - name: Print compiler errors if build fails
        if: failure()
        working-directory: v172-source
        shell: bash
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v270-build.log | head -5000 || true

      - name: Prepare APK
        if: success()
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V270-PRO-CAM.apk

      - name: Upload V270 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V270-PRO-CAM
          path: DEVELOP-UGANDA-V270-PRO-CAM.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V270-FINAL-BUILD-LOG
          path: v172-source/v270-build.log
          if-no-files-found: warn
          retention-days: 7
