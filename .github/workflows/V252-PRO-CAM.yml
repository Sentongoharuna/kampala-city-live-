name: Build develop.uganda V252 PRO CAM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V252-PRO-CAM.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout full repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install workflow replay helper
      run: python3 -m pip install --quiet pyyaml

    - name: Replay verified V251 PRO CAM source pipeline
      run: |
        set -e
        python3 - <<'PY2'
        from pathlib import Path
        import os
        import subprocess
        import yaml

        root = Path.cwd()
        source = root / ".github/workflows/V251-PRO-CAM.yml"
        if not source.exists():
            raise SystemExit("V251 PRO CAM workflow is missing")

        data = yaml.safe_load(source.read_text(encoding="utf-8"))
        steps = data["jobs"]["build"]["steps"]

        replayed = 0
        for step in steps:
            name = str(step.get("name", ""))
            if name == "Set up Java 17":
                break

            command = step.get("run")
            if not command:
                continue

            cwd = root
            working = step.get("working-directory")
            if working:
                cwd = root / working

            env = os.environ.copy()
            for key, value in (step.get("env") or {}).items():
                env[str(key)] = str(value)

            print(f"REPLAY: {name}", flush=True)
            subprocess.run(
                ["bash", "-lc", command],
                cwd=str(cwd),
                env=env,
                check=True,
            )
            replayed += 1

        if replayed < 3:
            raise SystemExit(f"Unexpectedly replayed only {replayed} V251 run steps")

        print(f"PASS: replayed {replayed} verified V251 source steps.")
        PY2

    - name: Apply V252 grouped Pro Settings style
      run: |
        set -e
        echo '' | base64 -d > /tmp/v252_settings_patch.py
        python3 -m py_compile /tmp/v252_settings_patch.py
        python3 /tmp/v252_settings_patch.py

        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V252 • PRO SETTINGS' "$PRO"
        grep -q 'Same develop.uganda camera colours and shooting interface' "$PRO"
        grep -q 'private fun v252Panel' "$PRO"
        grep -q 'private fun v252ToggleRow' "$PRO"
        grep -q 'Clean Master Recording' "$PRO"
        grep -q 'Face Exposure Priority' "$PRO"
        grep -q 'Focus Peaking + Zebras' "$PRO"
        grep -q 'LUTS / Color Grade' "$PRO"
        grep -q 'Aspect / Format' "$PRO"
        grep -q 'develop.uganda • V252 PRO CAM' "$HOME"
        grep -q 'V252 • PRO CAM' "$PANEL"
        grep -q 'versionCode = 25200' "$GRADLE"
        grep -q 'versionName = "252.0-settings-style"' "$GRADLE"

        # Preserve V250/V251 shooting systems and protected top controls.
        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        grep -q 'v251ToggleCleanMaster' "$CAMERA"
        grep -q 'v251ToggleFaceExposurePriority' "$CAMERA"
        grep -q 'v251ToggleProAssist' "$CAMERA"
        grep -q 'v250Cam2DismissAll' "$PRO"
        grep -q 'develop_uganda_v235_live_grade_panel' "$PRO"
        grep -q 'develop_uganda_v236_field_intelligence' "$PRO"

        echo "PASS: V252 settings style verified; camera palette and shooting interface preserved."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V252 PRO CAM APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v252-pro-cam-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v252-pro-cam-build.log | head -5000 || true

    - name: Prepare V252 PRO CAM artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V252-PRO-CAM.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V252-PRO-CAM-SOURCE.zip app build.gradle.kts settings.gradle.kts gradle.properties
        cd ..

    - name: Upload V252 PRO CAM APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V252-PRO-CAM
        path: DEVELOP-UGANDA-V252-PRO-CAM.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload V252 PRO CAM source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V252-PRO-CAM-SOURCE
        path: DEVELOP-UGANDA-V252-PRO-CAM-SOURCE.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload V252 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V252-PRO-CAM-BUILD-LOG
        path: v172-source/v252-pro-cam-build.log
        if-no-files-found: warn
        retention-days: 7
