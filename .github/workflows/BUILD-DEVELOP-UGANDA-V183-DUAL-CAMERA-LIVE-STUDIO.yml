name: Build develop.uganda V183 Dual Camera Live Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V183 source bundle
        run: |
          set -e
          test -f DEVELOP-UGANDA-V183-DUAL-CAMERA-LIVE-STUDIO-SOURCE.zip
          test -d v172-source
          echo "V183 source bundle found"

      - name: Install V183 source
        run: |
          set -e

          rm -rf /tmp/develop-v183
          mkdir -p /tmp/develop-v183

          unzip -q \
            DEVELOP-UGANDA-V183-DUAL-CAMERA-LIVE-STUDIO-SOURCE.zip \
            -d /tmp/develop-v183

          cp -R /tmp/develop-v183/app/. \
            v172-source/app/

      - name: Verify V183 dual-camera architecture
        run: |
          set -e
          BASE="v172-source/app/src/main/java/com/sentongoharuna/pulse"

          test -f "$BASE/DevelopUgandaCameraActivity.kt"
          test -f "$BASE/DevelopUgandaLiveActivity.kt"
          test -f "$BASE/DevelopUgandaNewsroomActivity.kt"
          test -f "$BASE/DevelopUgandaEditorActivity.kt"

          grep -q 'class DevelopUgandaLiveActivity' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q '● LIVE REC' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'LiveRecordButtonView' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'QUALITY' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'AUDIO' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'GRAPHICS' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'OUTPUT' "$BASE/DevelopUgandaLiveActivity.kt"
          grep -q 'DevelopUgandaLiveActivity' v172-source/app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 18300' v172-source/app/build.gradle.kts

          echo "V183 dual-camera architecture verified"

      - name: Commit V183 actual source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt \
            v172-source/app/src/main/AndroidManifest.xml \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V183 source already committed"
          else
            git commit -m "Add develop.uganda V183 Dual Camera Live Studio"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V183 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v183-build.log

      - name: Print exact compiler error and context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v183-build.log \
            | head -340 \
            || true

          echo "===== FIRST KOTLIN SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v183-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          m = re.search(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          filename = m.group(1)
          line_no = int(m.group(2))

          matches = list(
              Path("app/src/main/java").rglob(filename)
          )

          if not matches:
              print("Source file not found:", filename)
              raise SystemExit(0)

          lines = matches[0].read_text(
              encoding="utf-8"
          ).splitlines()

          for n in range(
              max(1, line_no - 10),
              min(len(lines), line_no + 14) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V183-DUAL-CAMERA-LIVE-STUDIO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V183-DUAL-CAMERA-LIVE-STUDIO
          path: DEVELOP-UGANDA-V183-DUAL-CAMERA-LIVE-STUDIO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V183-BUILD-LOG
          path: v172-source/v183-build.log
          if-no-files-found: warn
          retention-days: 7
