name: Build develop.uganda V271 PRO CAM LIVE COACH OUTPUT MASTER

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V271-PRO-CAM.yml'

permissions:
  contents: read

jobs:
  build_v271:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore verified V270 source package
        shell: bash
        run: |
          set -euo pipefail
          PACK='.github/workflows/DEVELOP-UGANDA-V270-PRO-CAM-BUILD-PACK.zip'
          test -f "$PACK" || { echo "Missing $PACK"; exit 1; }
          rm -rf /tmp/v270pack v172-source
          mkdir -p /tmp/v270pack v172-source
          unzip -q "$PACK" -d /tmp/v270pack
          test -f /tmp/v270pack/DEVELOP-UGANDA-V270-PRO-CAM-SOURCE.zip
          unzip -q /tmp/v270pack/DEVELOP-UGANDA-V270-PRO-CAM-SOURCE.zip -d v172-source

