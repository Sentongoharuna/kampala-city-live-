      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V271 PRO CAM APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v271-build.log

      - name: Print compiler errors if build fails
        if: failure()
        working-directory: v172-source
        shell: bash
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v271-build.log | head -5000 || true

      - name: Prepare V271 artifacts
        if: success()
        shell: bash
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V271-PRO-CAM.apk
          rm -rf v172-source/app/build
          (cd v172-source && zip -qr ../DEVELOP-UGANDA-V271-PRO-CAM-SOURCE.zip .)

      - name: Upload V271 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V271-PRO-CAM
          path: DEVELOP-UGANDA-V271-PRO-CAM.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V271 source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V271-PRO-CAM-SOURCE
          path: DEVELOP-UGANDA-V271-PRO-CAM-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V271-PRO-CAM-BUILD-LOG
          path: v172-source/v271-build.log
          if-no-files-found: warn
          retention-days: 7
