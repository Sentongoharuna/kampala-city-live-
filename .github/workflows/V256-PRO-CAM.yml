name: Build develop.uganda V256 PRO CAM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V256-PRO-CAM.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout full repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install workflow replay helper
      run: python3 -m pip install --quiet pyyaml

    - name: Replay verified V252 PRO CAM source pipeline
      run: |
        set -e
        python3 - <<'PY2'
        from pathlib import Path
        import os
        import subprocess
        import yaml

        root = Path.cwd()
        source = root / ".github/workflows/V252-PRO-CAM.yml"
        if not source.exists():
            raise SystemExit("V252 PRO CAM workflow is missing")

        data = yaml.safe_load(source.read_text(encoding="utf-8"))
        steps = data["jobs"]["build"]["steps"]
        replayed = 0
        for step in steps:
            name = str(step.get("name", ""))
            if name == "Set up Java 17":
                break
            command = step.get("run")
            if not command:
                continue
            cwd = root
            working = step.get("working-directory")
            if working:
                cwd = root / working
            env = os.environ.copy()
            for key, value in (step.get("env") or {}).items():
                env[str(key)] = str(value)
            print(f"REPLAY: {name}", flush=True)
            subprocess.run(["bash", "-lc", command], cwd=str(cwd), env=env, check=True)
            replayed += 1

        if replayed < 3:
            raise SystemExit(f"Unexpectedly replayed only {replayed} V252 run steps")
        print(f"PASS: replayed {replayed} verified V252 source steps.")
        PY2

    - name: Apply V253 live expandable settings
      run: |
        set -e
        echo '' | base64 -d > /tmp/v253_live_expand_patch.py
        python3 -m py_compile /tmp/v253_live_expand_patch.py
        python3 /tmp/v253_live_expand_patch.py

        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        FIELD="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFieldIntelligencePanel.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V253 • LIVE EXPAND SETTINGS' "$PRO"
        grep -q 'v253ExpandableRow' "$PRO"
        grep -q 'v253MovingSwitch' "$PRO"
        grep -q 'v253ChoiceGrid' "$PRO"
        grep -q 'internal fun v253SetQuality' "$CAMERA"
        grep -q 'internal fun v253LiveHealth' "$CAMERA"
        grep -q 'fun setFormat(context: Context, id: String)' "$FIELD"
        grep -q 'develop.uganda • V253 PRO CAM' "$HOME"
        grep -q 'V253 • PRO CAM' "$PANEL"
        grep -q 'versionCode = 25300' "$GRADLE"
        grep -q 'versionName = "253.0-live-expand-settings"' "$GRADLE"

        # Protected systems inherited from V252/V251/V250.
        grep -q 'v251ToggleCleanMaster' "$CAMERA"
        grep -q 'v251ToggleFaceExposurePriority' "$CAMERA"
        grep -q 'v251ToggleProAssist' "$CAMERA"
        grep -q 'v250Cam2DismissAll' "$PRO"
        grep -q 'develop_uganda_v235_live_grade_panel' "$PRO"
        grep -q 'develop_uganda_v236_field_intelligence' "$PRO"

        echo "PASS: V253 live expand settings verified; V252 colours and shooting UI preserved."

    - name: Apply V254 field controls and safety settings
      run: |
        set -e
        echo '' | base64 -d > /tmp/v254_field_control_patch.py
        python3 -m py_compile /tmp/v254_field_control_patch.py
        python3 /tmp/v254_field_control_patch.py

        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V254 • FIELD CONTROL + SAFETY' "$PRO"
        grep -q 'Record Preflight' "$PRO"
        grep -q 'Video Stabilization' "$PRO"
        grep -q 'Manual Camera Controls' "$PRO"
        grep -q 'Live Audio Meter' "$PRO"
        grep -q 'Storage Warning Level' "$PRO"
        grep -q 'Clip Recovery Journal' "$PRO"
        grep -q 'Telemetry Sidecar' "$PRO"
        grep -q 'Shoot Preset' "$PRO"
        grep -q 'internal fun v254AudioMeterEnabled' "$CAMERA"
        grep -q 'internal fun v254TogglePreflight' "$CAMERA"
        grep -q 'internal fun v254SetStorageThreshold' "$CAMERA"
        grep -q 'internal fun v254SetStabilizationPolicy' "$CAMERA"
        grep -q 'internal fun v254SetWhiteBalance' "$CAMERA"
        grep -q 'internal fun v254SetShutter' "$CAMERA"
        grep -q 'internal fun v254SetIso' "$CAMERA"
        grep -q 'internal fun v254SetClipNamingMode' "$CAMERA"
        grep -q 'internal fun v254ApplyShootPreset' "$CAMERA"
        grep -q 'baseName = v254ClipBaseName(reportId)' "$CAMERA"
        grep -q 'develop.uganda • V254 PRO CAM' "$HOME"
        grep -q 'V254 • PRO CAM' "$PANEL"
        grep -q 'versionCode = 25400' "$GRADLE"
        grep -q 'versionName = "254.0-field-control-safety"' "$GRADLE"

        # Protected V253/V252/V251/V250 behavior remains present.
        grep -q 'v253ExpandableRow' "$PRO"
        grep -q 'v253MovingSwitch' "$PRO"
        grep -q 'v253ChoiceGrid' "$PRO"
        grep -q 'v251ToggleCleanMaster' "$CAMERA"
        grep -q 'v251ToggleFaceExposurePriority' "$CAMERA"
        grep -q 'v251ToggleProAssist' "$CAMERA"
        grep -q 'v250Cam2DismissAll' "$PRO"
        grep -q 'develop_uganda_v235_live_grade_panel' "$PRO"

        echo "PASS: V254 field controls + safety settings verified; V252/V253 colours and main shooting interface preserved."

    - name: Apply V255 Pro Monitor + Tracking
      run: |
        set -e
        echo '' | base64 -d > /tmp/v255_pro_monitor_tracking_patch.py
        python3 -m py_compile /tmp/v255_pro_monitor_tracking_patch.py
        python3 /tmp/v255_pro_monitor_tracking_patch.py

        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        DIRECTOR="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDirectorOverlayView.kt"
        MONITOR="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV255ProMonitorView.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V255 • PRO MONITOR + TRACKING' "$PRO"
        grep -q 'Subject Tracking' "$PRO"
        grep -q 'Waveform Monitor' "$PRO"
        grep -q 'False Color Exposure' "$PRO"
        grep -q 'Focus Pull A / B' "$PRO"
        grep -q 'Performance Monitor' "$PRO"
        grep -q 'Thermal Protection' "$PRO"
        grep -q 'Audio Headroom Guard' "$PRO"
        grep -q 'internal fun v255SetSubjectTrackingMode' "$CAMERA"
        grep -q 'internal fun v255RunFocusPull' "$CAMERA"
        grep -q 'CaptureRequest.LENS_FOCUS_DISTANCE' "$CAMERA"
        grep -q 'v255RecordedBytes = event.recordingStats.numBytesRecorded' "$CAMERA"
        grep -q 'fun setTrackingAnchor' "$DIRECTOR"
        grep -q 'TRACK • FACE LOCK' "$DIRECTOR"
        grep -q 'class DevelopUgandaV255ProMonitorView' "$MONITOR"
        grep -q 'WAVEFORM • LUMA' "$MONITOR"
        grep -q 'develop.uganda • V255 PRO CAM' "$HOME"
        grep -q 'V255 • PRO CAM' "$PANEL"
        grep -q 'versionCode = 25500' "$GRADLE"
        grep -q 'versionName = "255.0-pro-monitor-tracking"' "$GRADLE"

        # Protected previous behavior remains present.
        grep -q 'v253ExpandableRow' "$PRO"
        grep -q 'v253MovingSwitch' "$PRO"
        grep -q 'v254AudioMeterEnabled' "$CAMERA"
        grep -q 'v254TogglePreflight' "$CAMERA"
        grep -q 'v251ToggleCleanMaster' "$CAMERA"
        grep -q 'v251ToggleFaceExposurePriority' "$CAMERA"
        grep -q 'v250Cam2DismissAll' "$PRO"
        grep -q 'develop_uganda_v235_live_grade_panel' "$PRO"

        echo "PASS: V255 Pro Monitor + Tracking verified; V252/V253/V254 palette and main shooting interface preserved."

    - name: Apply V256 Tactile Control + Clean Cam
      run: |
        set -e
        echo '' | base64 -d > /tmp/v256_clean_tactile_patch.py
        python3 -m py_compile /tmp/v256_clean_tactile_patch.py
        python3 /tmp/v256_clean_tactile_patch.py

        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        ADAPTIVE="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdaptiveFormatUi.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'V256 • TACTILE CONTROL + CLEAN CAM' "$PRO"
        grep -q 'Switch Haptics' "$PRO"
        grep -q 'Switch Motion' "$PRO"
        grep -q 'Timecode Mode' "$PRO"
        grep -q 'v256_switch_on_label' "$PRO"
        grep -q 'v256_switch_off_label' "$PRO"
        grep -q 'internal fun v256SetTimecodeMode' "$CAMERA"
        grep -q 'v256TimecodeModeState == "TIME OF DAY"' "$CAMERA"
        grep -q 'V256 CLEAN CAM: do not attach the legacy full-width REPORT ID / CITIZEN row' "$CAMERA"
        ! grep -q 'bottomDeck.addView(identityRow)' "$CAMERA"
        ! grep -q 'bottomDeck.addView(settingsSummaryView)' "$CAMERA"
        ! grep -q 'identity?.visibility = View.VISIBLE' "$ADAPTIVE"
        grep -q 'develop.uganda • V256 PRO CAM' "$HOME"
        grep -q 'V256 • PRO CAM' "$PANEL"
        grep -q 'versionCode = 25600' "$GRADLE"
        grep -q 'versionName = "256.0-tactile-clean-cam"' "$GRADLE"

        # Protected V255 and earlier systems remain present.
        grep -q 'internal fun v255SetSubjectTrackingMode' "$CAMERA"
        grep -q 'internal fun v255RunFocusPull' "$CAMERA"
        grep -q 'Waveform Monitor' "$PRO"
        grep -q 'v254AudioMeterEnabled' "$CAMERA"
        grep -q 'v251ToggleCleanMaster' "$CAMERA"
        grep -q 'v250Cam2DismissAll' "$PRO"

        echo "PASS: V256 tactile switches + permanent clean deck + selectable timecode verified; prior camera systems preserved."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V256 PRO CAM APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v256-pro-cam-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v256-pro-cam-build.log | head -5000 || true

    - name: Prepare V256 PRO CAM artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V256-PRO-CAM.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V256-PRO-CAM-SOURCE.zip app build.gradle.kts settings.gradle.kts gradle.properties
        cd ..

    - name: Upload V256 PRO CAM APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V256-PRO-CAM
        path: DEVELOP-UGANDA-V256-PRO-CAM.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload V256 PRO CAM source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V256-PRO-CAM-SOURCE
        path: DEVELOP-UGANDA-V256-PRO-CAM-SOURCE.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload V256 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V256-PRO-CAM-BUILD-LOG
        path: v172-source/v256-pro-cam-build.log
        if-no-files-found: warn
        retention-days: 7
