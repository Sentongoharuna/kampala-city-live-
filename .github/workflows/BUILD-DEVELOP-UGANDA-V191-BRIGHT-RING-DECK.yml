name: Build develop.uganda V191 Bright Ring Deck

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V191 source bundle
        run: |
          set -e
          test -f DEVELOP-UGANDA-V191-BRIGHT-RING-DECK-SOURCE.zip
          test -d v172-source
          echo "V191 source bundle found"

      - name: Install V191 source
        run: |
          set -e

          rm -rf /tmp/develop-v191
          mkdir -p /tmp/develop-v191

          unzip -q \
            DEVELOP-UGANDA-V191-BRIGHT-RING-DECK-SOURCE.zip \
            -d /tmp/develop-v191

          cp -R /tmp/develop-v191/app/. \
            v172-source/app/

      - name: Verify V191 requested UI and wording
        run: |
          set -e

          BASE="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          REPORT="$BASE/DevelopUgandaCameraActivity.kt"
          LIVE="$BASE/DevelopUgandaLiveActivity.kt"

          grep -q 'strokeWidth =' "$REPORT"
          grep -q 'selectedFillPaint' "$REPORT"
          grep -q 'isSelected ->' "$REPORT"
          grep -q 'ColorDrawable(' "$REPORT"
          grep -q 'LOCATION •' "$REPORT"
          grep -q 'GPS STATUS •' "$REPORT"
          grep -q 'NAVIGATION •' "$REPORT"
          grep -q 'AUTO ISO' "$REPORT"

          grep -q 'selectedFill' "$LIVE"
          grep -q 'ON AIR' "$LIVE"
          grep -q 'LIVE NOW' "$LIVE"
          grep -q 'AUDIO ON' "$LIVE"

          grep -q 'versionCode = 19100' \
            v172-source/app/build.gradle.kts

          echo "V191 Bright Ring Deck verified"

      - name: Commit V191 actual source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt \
            v172-source/app/src/main/AndroidManifest.xml \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V191 source already committed"
          else
            git commit -m "Add develop.uganda V191 Bright Ring Deck"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V191 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v191-build.log

      - name: Print exact compiler error and source context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v191-build.log \
            | head -650 \
            || true

          echo "===== FIRST KOTLIN SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v191-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          m = re.search(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          filename = m.group(1)
          line_no = int(m.group(2))

          matches = list(
              Path("app/src/main/java").rglob(filename)
          )

          if not matches:
              print("Source file not found:", filename)
              raise SystemExit(0)

          lines = matches[0].read_text(
              encoding="utf-8"
          ).splitlines()

          for n in range(
              max(1, line_no - 20),
              min(len(lines), line_no + 32) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V191-BRIGHT-RING-DECK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V191-BRIGHT-RING-DECK
          path: DEVELOP-UGANDA-V191-BRIGHT-RING-DECK.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V191-BUILD-LOG
          path: v172-source/v191-build.log
          if-no-files-found: warn
          retention-days: 7
