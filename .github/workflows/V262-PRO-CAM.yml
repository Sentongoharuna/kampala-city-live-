    - name: Verify V262 Remote Director source
      run: |
        set -e
        CAM="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        REM="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV262RemoteDirector.kt"
        HUB="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        MANIFEST="v172-source/app/src/main/AndroidManifest.xml"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'class DevelopUgandaV262RemoteDirectorActivity' "$REM"
        grep -q 'class DevelopUgandaV262RemoteServer' "$REM"
        grep -q 'PORT = 8262' "$REM"
        grep -q 'v262RemoteCommandSync' "$CAM"
        grep -q 'v262RemotePreviewFrame' "$CAM"
        grep -q 'REMOTE AF + AE + AWB' "$CAM"
        grep -q 'V262 REMOTE DIRECTOR' "$PRO"
        grep -q 'Remote Camera Host' "$PRO"
        grep -q 'Recording Priority' "$PRO"
        grep -q 'REMOTE DIRECTOR / MULTI-CAM' "$HUB"
        grep -q 'DevelopUgandaV262RemoteDirectorActivity' "$MANIFEST"
        grep -q 'NEARBY_WIFI_DEVICES' "$MANIFEST"
        grep -q 'versionCode = 26200' "$GRADLE"
        grep -q 'versionName = "262.0-remote-director-multicam"' "$GRADLE"

        ! grep -q 'bottomDeck.addView(identityRow)' "$CAM"
        ! grep -q 'bottomDeck.addView(settingsSummaryView)' "$CAM"
        grep -q 'internal fun v261DirectorMonitorStatus' "$CAM"
        grep -q 'internal fun v260ProjectStatus' "$CAM"
        grep -q 'internal fun v259RecordingConfidenceScore' "$CAM"
        grep -q 'internal fun v257SetBitrateMode' "$CAM"
        grep -q 'v253MovingSwitch' "$PRO"

        echo "PASS: V262 Remote Director source verified; local master + prior systems preserved."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V262 PRO CAM APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v262-pro-cam-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v262-pro-cam-build.log | head -5000 || true

    - name: Prepare V262 PRO CAM artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V262-PRO-CAM.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V262-PRO-CAM-SOURCE.zip app build.gradle.kts settings.gradle.kts gradle.properties -x 'app/build/*'
        cd ..

    - name: Upload V262 PRO CAM APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V262-PRO-CAM
        path: DEVELOP-UGANDA-V262-PRO-CAM.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload V262 PRO CAM source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V262-PRO-CAM-SOURCE
        path: DEVELOP-UGANDA-V262-PRO-CAM-SOURCE.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload V262 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V262-PRO-CAM-BUILD-LOG
        path: v172-source/v262-pro-cam-build.log
        if-no-files-found: warn
        retention-days: 7
