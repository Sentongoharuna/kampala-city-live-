name: Build develop.uganda V233 Unified Live Control Deck FIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V232 working base
        run: |
          set -e
          test -f DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK-PATCH.zip

          GRADLE="v172-source/app/build.gradle.kts"
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"

          grep -q 'versionCode = 23200' "$GRADLE"
          grep -q 'versionName = "232.0-live-grade-monitor"' "$GRADLE"
          test -f "$SRC/DevelopUgandaLiveGradePanel.kt"
          test -f "$SRC/DevelopUgandaColorEngine.kt"
          test -f "$SRC/DevelopUgandaColorTuner.kt"
          test -f "$SRC/DevelopUgandaColorStudioActivity.kt"
          grep -q 'DevelopUgandaLiveGradePanel.attach' "$SRC/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaLiveGradePanel.attach' "$SRC/DevelopUgandaLiveActivity.kt"
          grep -q 'versionName = "232.0-live-grade-monitor"' "$GRADLE"

          echo "PASS: V232 Live Grade Monitor base confirmed."

      - name: Unpack and syntax-check V233 patch
        run: |
          set -e
          rm -rf /tmp/v233
          mkdir -p /tmp/v233
          unzip -q DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK-PATCH.zip -d /tmp/v233
          python3 -m py_compile /tmp/v233/v233_patch.py
          test -f /tmp/v233/DevelopUgandaUnifiedControlDeck.kt
          test -f /tmp/v233/README-V233.txt

          # FIX1: the implementation title is Title Case while the V233 safety
          # verifier intentionally searches for the canonical uppercase marker.
          # Add the marker to the temporary patch copy only; no camera logic changes.
          if ! grep -q 'UNIFIED LIVE CONTROL DECK' /tmp/v233/DevelopUgandaUnifiedControlDeck.kt; then
            printf '\n// UNIFIED LIVE CONTROL DECK\n' >> /tmp/v233/DevelopUgandaUnifiedControlDeck.kt
          fi
          grep -q 'UNIFIED LIVE CONTROL DECK' /tmp/v233/DevelopUgandaUnifiedControlDeck.kt

          echo "PASS: V233 patch package complete + FIX1 verification marker applied."

      - name: Lock protected camera and retained systems
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          protected = [
              "DevelopUgandaDirectorOverlayView.kt",
              "DevelopUgandaClipQc.kt",
              "DevelopUgandaContinuityMemory.kt",
              "DevelopUgandaLensIntelligence.kt",
              "DevelopUgandaCameraHealthActivity.kt",
              "DevelopUgandaPhotoSuiteActivity.kt",
              "DevelopUgandaColorEngine.kt",
              "DevelopUgandaColorTuner.kt",
              "DevelopUgandaMediaInbox.kt",
              "DevelopUgandaStoryPlayerActivity.kt",
          ]

          for name in protected:
              if not (SRC / name).exists():
                  raise SystemExit(f"Protected V232 base file missing: {name}")

          def function_block(path, function_name):
              text = path.read_text(encoding="utf-8")
              marker = f"fun {function_name}"
              start = text.index(marker)
              line_start = text.rfind("\n", 0, start) + 1
              brace = text.index("{", start)
              depth = 0
              quote = None
              escaped = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[line_start:i+1]
              raise RuntimeError(function_name)

          saved = {
              name: hashlib.sha256((SRC / name).read_bytes()).hexdigest()
              for name in protected
          }

          for key, filename, fn in [
              ("report_bind", "DevelopUgandaCameraActivity.kt", "bindCamera"),
              ("live_bind", "DevelopUgandaLiveActivity.kt", "bindCamera"),
              ("photo_bind", "DevelopUgandaPhotoSuiteActivity.kt", "bindCamera"),
              ("social_export", "DevelopUgandaCameraActivity.kt", "exportAutomaticSocialMaster"),
              ("social_verify", "DevelopUgandaCameraActivity.kt", "verifyAutomaticSocialMaster"),
          ]:
              saved[key] = hashlib.sha256(
                  function_block(SRC / filename, fn).encode()
              ).hexdigest()

          Path("/tmp/v233-protected.json").write_text(
              json.dumps(saved), encoding="utf-8"
          )
          print("PASS: V232 protected fingerprints saved.")
          PY

      - name: Apply V233 Unified Live Control Deck
        run: |
          set -e
          python3 /tmp/v233/v233_patch.py

      - name: Prove protected systems were not changed
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          before = json.loads(
              Path("/tmp/v233-protected.json").read_text(encoding="utf-8")
          )
          protected = [
              "DevelopUgandaDirectorOverlayView.kt",
              "DevelopUgandaClipQc.kt",
              "DevelopUgandaContinuityMemory.kt",
              "DevelopUgandaLensIntelligence.kt",
              "DevelopUgandaCameraHealthActivity.kt",
              "DevelopUgandaPhotoSuiteActivity.kt",
              "DevelopUgandaColorEngine.kt",
              "DevelopUgandaColorTuner.kt",
              "DevelopUgandaMediaInbox.kt",
              "DevelopUgandaStoryPlayerActivity.kt",
          ]

          def function_block(path, function_name):
              text = path.read_text(encoding="utf-8")
              marker = f"fun {function_name}"
              start = text.index(marker)
              line_start = text.rfind("\n", 0, start) + 1
              brace = text.index("{", start)
              depth = 0
              quote = None
              escaped = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[line_start:i+1]
              raise RuntimeError(function_name)

          current = {
              name: hashlib.sha256((SRC / name).read_bytes()).hexdigest()
              for name in protected
          }

          for key, filename, fn in [
              ("report_bind", "DevelopUgandaCameraActivity.kt", "bindCamera"),
              ("live_bind", "DevelopUgandaLiveActivity.kt", "bindCamera"),
              ("photo_bind", "DevelopUgandaPhotoSuiteActivity.kt", "bindCamera"),
              ("social_export", "DevelopUgandaCameraActivity.kt", "exportAutomaticSocialMaster"),
              ("social_verify", "DevelopUgandaCameraActivity.kt", "verifyAutomaticSocialMaster"),
          ]:
              current[key] = hashlib.sha256(
                  function_block(SRC / filename, fn).encode()
              ).hexdigest()

          failures = [
              key for key, old in before.items()
              if current.get(key) != old
          ]
          if failures:
              raise SystemExit(
                  "Protected system changed unexpectedly: " + ", ".join(failures)
              )

          print("PASS: CameraX bind engines unchanged.")
          print("PASS: V232 17³ Color Engine/Tuner unchanged.")
          print("PASS: Social Master export/verification unchanged.")
          print("PASS: Director/QC, Photo, Continuity and Media systems retained.")
          PY

      - name: Verify V233 unified live controls
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          deck = (SRC / "DevelopUgandaUnifiedControlDeck.kt").read_text(encoding="utf-8")
          report = (SRC / "DevelopUgandaCameraActivity.kt").read_text(encoding="utf-8")
          live = (SRC / "DevelopUgandaLiveActivity.kt").read_text(encoding="utf-8")
          grade = (SRC / "DevelopUgandaLiveGradePanel.kt").read_text(encoding="utf-8")
          studio = (SRC / "DevelopUgandaColorStudioActivity.kt").read_text(encoding="utf-8")
          newsroom = (SRC / "DevelopUgandaNewsroomActivity.kt").read_text(encoding="utf-8")
          brand = (SRC / "DevelopUgandaBrandMetadataStore.kt").read_text(encoding="utf-8")
          gradle = Path("v172-source/app/build.gradle.kts").read_text(encoding="utf-8")

          checks = [
              ("deck-title", deck, "UNIFIED LIVE CONTROL DECK"),
              ("palette-theme", deck, "currentPalette"),
              ("glass-buttons", deck, "styleAllButtons"),
              ("report-compact", deck, "compactReportControls"),
              ("live-tools", deck, "V233 • UNIFIED LIVE TOOLS"),
              ("record-safe", deck, "RECORD remains the primary red"),
              ("report-attach", report, "DevelopUgandaUnifiedControlDeck.Mode.REPORT"),
              ("live-attach", live, "DevelopUgandaUnifiedControlDeck.Mode.LIVE"),
              ("report-output", report, "DEVELOP_UGANDA_V233_"),
              ("live-output", live, "DEVELOP_UGANDA_V233_LIVE_"),
              ("grade-v233", grade, "V233"),
              ("studio-v233", studio, "develop.uganda • V233"),
              ("newsroom-v233", newsroom, "UNIFIED LIVE CONTROL DECK • V233"),
              ("brand-v233", brand, "Recorded with develop.uganda • V233"),
              ("version-code", gradle, "versionCode = 23300"),
              ("version-name", gradle, 'versionName = "233.0-unified-live-control-deck"'),
          ]

          failed = []
          for label, source, needle in checks:
              if needle in source:
                  print(f"PASS [{label}]")
              else:
                  print(f"FAIL [{label}] missing {needle}")
                  failed.append(label)

          if failed:
              raise SystemExit("V233 verification failed: " + ", ".join(failed))

          print("PASS: V233 Unified Live Control Deck implementation verified.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V233 APK before commit
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v233-build.log

      - name: Print exact compiler errors and context
        if: failure()
        working-directory: v172-source
        run: |
          if [ ! -f v233-build.log ]; then
            echo "Gradle did not start. Check failed step above."
            exit 0
          fi

          echo "===== V233 IMPORTANT ERRORS ====="
          grep -Ein "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|no value passed|too many arguments|FAILURE:)" v233-build.log | head -6000 || true

          echo "===== SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v233-build.log").read_text(encoding="utf-8", errors="ignore")
          seen = set()
          for filename, line_text, col in re.findall(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)', log
          ):
              key = (filename, line_text)
              if key in seen:
                  continue
              seen.add(key)
              if len(seen) > 60:
                  break
              line_no = int(line_text)
              files = list(Path("app/src/main/java").rglob(filename))
              if not files:
                  continue
              path = files[0]
              lines = path.read_text(encoding="utf-8").splitlines()
              print(f"\nFILE: {path} LINE: {line_no}")
              for n in range(max(1, line_no-45), min(len(lines), line_no+80)+1):
                  mark = ">>" if n == line_no else "  "
                  print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Commit V233 only after successful APK build
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaUnifiedControlDeck.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveGradePanel.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorStudioActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBrandMetadataStore.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInstantReviewDialog.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStoryPackager.kt \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V233 source already committed."
          else
            git commit -m "Add develop.uganda V233 Unified Live Control Deck"
            git push
          fi

      - name: Package successful V233 source
        run: |
          set -e
          cd v172-source
          zip -qr ../DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK-SOURCE.zip . \
            -x 'app/build/*' '.gradle/*' 'v233-build.log'

      - name: Prepare V233 APK
        run: |
          set -e
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK.apk
          ls -lh DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK.apk

      - name: Upload V233 APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK
          path: DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK.apk
          if-no-files-found: error

      - name: Upload V233 source
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V233-SOURCE
          path: DEVELOP-UGANDA-V233-UNIFIED-LIVE-CONTROL-DECK-SOURCE.zip
          if-no-files-found: error

      - name: Upload V233 build log if needed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V233-BUILD-LOG
          path: v172-source/v233-build.log
          if-no-files-found: ignore
