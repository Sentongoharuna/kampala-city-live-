      - name: Verify V280 preservation and Smart Director integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 28000' v172-source/app/build.gradle.kts
          grep -q 'versionName = "280.0-smart-director-mode"' v172-source/app/build.gradle.kts
