          echo 'PASS: V280 is cumulative on V279 and Smart Director is wired to the preserved workflow stack.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v280-build.log

      - name: Print compiler errors if build fails
        if: failure()
        working-directory: v172-source
        shell: bash
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v280-build.log | head -5000 || true

      - name: Prepare V280 APK
        if: success()
        run: cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V280R-PRO-CAM.apk

      - name: Upload V280 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280R-PRO-CAM
          path: DEVELOP-UGANDA-V280R-PRO-CAM.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V280 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-BUILD-LOG
          path: v172-source/v280-build.log
          if-no-files-found: warn
          retention-days: 7
