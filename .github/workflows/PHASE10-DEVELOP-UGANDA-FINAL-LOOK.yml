name: Build develop.uganda Phase 10 FINAL LOOK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # PHASE 10
      # develop.uganda FINAL LOOK
      #
      # CUMULATIVE BUILD
      #
      # TARGET:
      # - keep previous working camera/reporting functionality
      # - fix cellularGeneration compile problem first
      # - rename visible public brand to develop.uganda
      # - 9:16 upright portrait reporting camera
      # - straight horizontal wording
      # - NO sideways/rotated telemetry
      # - NO black telemetry background
      # - NO large side strip
      # - NO bottom telemetry strip
      # - very small compressed coloured metadata
      # - professional camera / broadcast recorder appearance
      # - grid / horizon / reticle / frame guides
      # - compact professional control styling
      # - existing working camera controls are preserved
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify cumulative source
        run: |
          set -e

          test -f PULSE-PHASE4-ADVANCED-TELEMETRY-SOURCE.zip

          echo "=========================================="
          echo "PHASE 10 SOURCE FOUND"
          echo "=========================================="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # ============================================================
      # UNPACK KNOWN WORKING CUMULATIVE PROJECT
      # ============================================================

      - name: Unpack Phase 10 cumulative project
        run: |
          set -e

          rm -rf phase10-build
          mkdir -p phase10-build

          unzip -q \
            PULSE-PHASE4-ADVANCED-TELEMETRY-SOURCE.zip \
            -d phase10-build

          PROJECT="phase10-build/pulse-phase4-production"

          test -f "$PROJECT/gradle.properties"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT/app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt"

          test -f \
            "$PROJECT/app/src/main/java/com/sentongoharuna/pulse/LiveActivity.kt"

          test -f \
            "$PROJECT/app/src/main/java/com/sentongoharuna/pulse/ProMonitorOverlayView.kt"

          echo "Phase 10 project unpacked successfully"

      # ============================================================
      # FIRST FIX THE EXACT BUILD ERROR SEEN IN PHASE 9
      #
      # This follows the proven Phase 4 compatibility method.
      # ============================================================

      - name: Fix cellularGeneration compatibility FIRST
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "phase10-build/pulse-phase4-production/"
              "app/src/main/java/com/sentongoharuna/pulse/"
              "LiveActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------
          # If the helper does not already exist, replace
          # unresolved old references and add the compatibility
          # helper used by the successful Phase 4 build.
          # --------------------------------------------------

          if "private fun cellularGenerationCompat" not in text:

              text = re.sub(
                  r'\bcellularGeneration\s*\(\s*\)',
                  'cellularGenerationCompat(this@LiveActivity)',
                  text
              )

              text = re.sub(
                  r'\bcellularGeneration\b',
                  'cellularGenerationCompat(this@LiveActivity)',
                  text
              )

              helper = r'''

          private fun cellularGenerationCompat(
              context: android.content.Context
          ): String {

              val connectivity =
                  context.getSystemService(
                      android.content.Context.CONNECTIVITY_SERVICE
                  ) as android.net.ConnectivityManager

              val network =
                  connectivity.activeNetwork
                      ?: return "OFFLINE"

              val capabilities =
                  connectivity.getNetworkCapabilities(network)
                      ?: return "UNKNOWN"

              if (
                  capabilities.hasTransport(
                      android.net.NetworkCapabilities.TRANSPORT_WIFI
                  )
              ) {
                  return "Wi-Fi"
              }

              if (
                  !capabilities.hasTransport(
                      android.net.NetworkCapabilities.TRANSPORT_CELLULAR
                  )
              ) {
                  return "NETWORK"
              }

              val telephony =
                  context.getSystemService(
                      android.content.Context.TELEPHONY_SERVICE
                  ) as android.telephony.TelephonyManager

              val type = try {

                  if (
                      android.os.Build.VERSION.SDK_INT >=
                      android.os.Build.VERSION_CODES.N
                  ) {
                      telephony.dataNetworkType
                  } else {
                      @Suppress("DEPRECATION")
                      telephony.networkType
                  }

              } catch (_: SecurityException) {

                  return "CELLULAR"

              } catch (_: Exception) {

                  return "CELLULAR"
              }

              return when (type) {

                  android.telephony.TelephonyManager.NETWORK_TYPE_NR ->
                      "5G"

                  android.telephony.TelephonyManager.NETWORK_TYPE_LTE ->
                      "4G"

                  android.telephony.TelephonyManager.NETWORK_TYPE_UMTS,
                  android.telephony.TelephonyManager.NETWORK_TYPE_EVDO_0,
                  android.telephony.TelephonyManager.NETWORK_TYPE_EVDO_A,
                  android.telephony.TelephonyManager.NETWORK_TYPE_EVDO_B,
                  android.telephony.TelephonyManager.NETWORK_TYPE_HSDPA,
                  android.telephony.TelephonyManager.NETWORK_TYPE_HSUPA,
                  android.telephony.TelephonyManager.NETWORK_TYPE_HSPA,
                  android.telephony.TelephonyManager.NETWORK_TYPE_HSPAP,
                  android.telephony.TelephonyManager.NETWORK_TYPE_EHRPD ->
                      "3G"

                  android.telephony.TelephonyManager.NETWORK_TYPE_GPRS,
                  android.telephony.TelephonyManager.NETWORK_TYPE_EDGE,
                  android.telephony.TelephonyManager.NETWORK_TYPE_CDMA,
                  android.telephony.TelephonyManager.NETWORK_TYPE_1xRTT,
                  android.telephony.TelephonyManager.NETWORK_TYPE_IDEN,
                  android.telephony.TelephonyManager.NETWORK_TYPE_GSM ->
                      "2G"

                  else ->
                      "CELLULAR"
              }
          }
          '''

              text += helper

          else:

              # The helper exists. Fix any remaining old references.
              text = re.sub(
                  r'\bcellularGeneration\s*\(\s*\)',
                  'cellularGenerationCompat(this@LiveActivity)',
                  text
              )

              text = re.sub(
                  r'\bcellularGeneration\b(?!Compat)',
                  'cellularGenerationCompat(this@LiveActivity)',
                  text
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "cellularGeneration compatibility fix applied"
          )
          PY

      - name: Verify cellular compile fix
        run: |
          FILE="phase10-build/pulse-phase4-production/app/src/main/java/com/sentongoharuna/pulse/LiveActivity.kt"

          grep -q \
            "cellularGenerationCompat" \
            "$FILE"

          echo "Cellular telemetry compile fix verified"

      # ============================================================
      # BRAND CHANGE
      #
      # Visible/public brand only.
      # Internal Android package remains unchanged.
      # ============================================================

      - name: Rename visible brand to develop.uganda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "phase10-build/pulse-phase4-production/"
              "app/src/main"
          )

          # --------------------------------------------------
          # XML resources
          # --------------------------------------------------

          for path in root.rglob("*.xml"):

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              original = text

              text = re.sub(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\1develop.uganda\2',
                  text,
                  flags=re.DOTALL
              )

              text = text.replace(
                  ">PULSE<",
                  ">develop.uganda<"
              )

              text = text.replace(
                  ">Pulse<",
                  ">develop.uganda<"
              )

              if path.name == "AndroidManifest.xml":

                  text = re.sub(
                      r'android:label="PULSE[^"]*"',
                      'android:label="develop.uganda"',
                      text
                  )

              if text != original:

                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

          # --------------------------------------------------
          # Kotlin visible strings ONLY
          #
          # Do not rename class names, package names,
          # functions or Kotlin identifiers.
          # --------------------------------------------------

          string_pattern = re.compile(
              r'"(?:\\.|[^"\\])*"'
          )

          kotlin_targets = [

              root /
              "java/com/sentongoharuna/pulse/MainActivity.kt",

              root /
              "java/com/sentongoharuna/pulse/LiveActivity.kt",

              root /
              "java/com/sentongoharuna/pulse/ProMonitorOverlayView.kt",
          ]

          for path in kotlin_targets:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              def replace_visible(match):

                  token = match.group(0)
                  content = token[1:-1]

                  content = content.replace(
                      "PULSE NEWS",
                      "develop.uganda"
                  )

                  content = content.replace(
                      "PULSE REPORTER",
                      "develop.uganda"
                  )

                  content = content.replace(
                      "PULSE",
                      "develop.uganda"
                  )

                  return '"' + content + '"'

              text = string_pattern.sub(
                  replace_visible,
                  text
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Public branding changed safely to develop.uganda"
          )
          PY

      # ============================================================
      # PHASE 10 SAVED-VIDEO HUD
      #
      # IMPORTANT:
      # - straight words
      # - no sideways writing
      # - no black box
      # - no black strip
      # - very small
      # - coloured information
      # ============================================================

      - name: Build final tiny transparent telemetry HUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "phase10-build/pulse-phase4-production/"
              "app/src/main/java/com/sentongoharuna/pulse/"
              "ProMonitorOverlayView.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          before = text

          # --------------------------------------------------
          # A. STRAIGHT WORDING
          #
          # Eliminate sideways canvas rotations in the
          # telemetry renderer.
          # --------------------------------------------------

          text = re.sub(
              r'canvas\.rotate\s*\([^;\n]*\)',
              'canvas.rotate(0f)',
              text
          )

          text = re.sub(
              r'\.rotation\s*=\s*-?90(?:\.0)?f',
              '.rotation = 0f',
              text
          )

          text = re.sub(
              r'\.rotation\s*=\s*270(?:\.0)?f',
              '.rotation = 0f',
              text
          )

          # --------------------------------------------------
          # B. EXTREMELY SMALL TEXT
          #
          # Keep it readable but compressed.
          # --------------------------------------------------

          def shrink_text(match):

              prefix = match.group(1)

              try:
                  value = float(
                      match.group(2)
                  )
              except Exception:
                  return match.group(0)

              new_value = max(
                  6.0,
                  min(
                      9.0,
                      value * 0.30
                  )
              )

              number = (
                  f"{new_value:.1f}"
                  .rstrip("0")
                  .rstrip(".")
              )

              return (
                  prefix +
                  number +
                  "f"
              )

          text = re.sub(
              r'((?:\.?textSize)\s*=\s*)'
              r'([0-9]+(?:\.[0-9]+)?)f',
              shrink_text,
              text
          )

          # dp/sp wrapped textSize values
          text = re.sub(
              r'(\.textSize\s*=\s*(?:dp|sp)\s*\(\s*)'
              r'[0-9]+(?:\.[0-9]+)?f'
              r'(\s*\))',
              r'\g<1>7f\2',
              text
          )

          # --------------------------------------------------
          # C. REMOVE BLACK/DARK HUD BACKGROUNDS COMPLETELY
          # --------------------------------------------------

          dark_hex = [
              "0xFF000000",
              "0xFA000000",
              "0xF5000000",
              "0xF0000000",
              "0xEE000000",
              "0xE8000000",
              "0xE6000000",
              "0xE0000000",
              "0xDD000000",
              "0xD9000000",
              "0xD0000000",
              "0xCC000000",
              "0xC8000000",
              "0xC0000000",
              "0xB8000000",
              "0xB5000000",
              "0xB0000000",
              "0xAA000000",
              "0xA6000000",
              "0xA0000000",
              "0x99000000",
              "0x98000000",
              "0x92000000",
              "0x90000000",
              "0x8C000000",
              "0x88000000",
              "0x80000000",
              "0x7A000000",
              "0x78000000",
              "0x70000000",
              "0x66000000",
              "0x55000000",
              "0x44000000"
          ]

          for value in dark_hex:

              text = text.replace(
                  value,
                  "0x00000000"
              )

          # Android Color.argb black translucent panels
          text = re.sub(
              r'(?:android\.graphics\.)?Color\.argb'
              r'\(\s*\d+\s*,\s*0\s*,\s*0\s*,\s*0\s*\)',
              'android.graphics.Color.TRANSPARENT',
              text
          )

          # Color.BLACK used by explicitly named panel paints
          text = re.sub(
              r'(\b[A-Za-z_][A-Za-z0-9_]*'
              r'(?:panel|Panel|background|Background|'
              r'backdrop|Backdrop|sidebar|Sidebar|'
              r'strip|Strip|box|Box|hudBg|HudBg)'
              r'[A-Za-z0-9_]*\.color\s*=\s*)'
              r'(?:android\.graphics\.)?Color\.BLACK',
              r'\1android.graphics.Color.TRANSPARENT',
              text
          )

          # Any named HUD background paint assignment
          text = re.sub(
              r'(\b[A-Za-z_][A-Za-z0-9_]*'
              r'(?:panel|Panel|background|Background|'
              r'backdrop|Backdrop|sidebar|Sidebar|'
              r'strip|Strip|box|Box|hudBg|HudBg)'
              r'[A-Za-z0-9_]*\.color\s*=\s*)'
              r'[^\n]+',
              r'\1android.graphics.Color.TRANSPARENT',
              text
          )

          # --------------------------------------------------
          # D. SHRINK LARGE OLD TELEMETRY PANEL WIDTHS
          # --------------------------------------------------

          text = re.sub(
              r'width\s*\*\s*0\.(?:5[0-9]|4[0-9]|3[0-9])f',
              'width * 0.12f',
              text
          )

          text = re.sub(
              r'width\s*\*\s*0\.2[0-9]f',
              'width * 0.12f',
              text
          )

          # --------------------------------------------------
          # E. COMPRESS LINE SPACING
          # --------------------------------------------------

          text = re.sub(
              r'(\b[A-Za-z_][A-Za-z0-9_]*'
              r'(?:lineHeight|LineHeight|spacing|Spacing|'
              r'rowHeight|RowHeight|gap|Gap)'
              r'\s*=\s*)'
              r'[0-9]+(?:\.[0-9]+)?f',
              r'\g<1>8f',
              text
          )

          # --------------------------------------------------
          # F. PROFESSIONAL COLOUR SYSTEM
          # --------------------------------------------------

          GOLD = (
              "android.graphics.Color.rgb(255,193,7)"
          )

          RED = (
              "android.graphics.Color.rgb(255,48,48)"
          )

          WHITE = (
              "android.graphics.Color.rgb(255,255,255)"
          )

          CYAN = (
              "android.graphics.Color.rgb(0,229,255)"
          )

          BLUE = (
              "android.graphics.Color.rgb(64,196,255)"
          )

          GREEN = (
              "android.graphics.Color.rgb(80,220,120)"
          )

          colour_rules = {

              "brand": GOLD,
              "pulse": GOLD,
              "develop": GOLD,
              "camera": GOLD,
              "mode": GOLD,
              "fps": GOLD,
              "uhd": GOLD,
              "codec": GOLD,
              "hevc": GOLD,
              "hdr": GOLD,

              "rec": RED,
              "record": RED,

              "gps": CYAN,
              "coord": CYAN,
              "lat": CYAN,
              "lon": CYAN,
              "alt": CYAN,
              "elevation": CYAN,

              "weather": BLUE,
              "wx": BLUE,
              "temp": BLUE,
              "humidity": BLUE,
              "wind": BLUE,

              "mic": GREEN,
              "audio": GREEN,
              "network": GREEN,
              "signal": GREEN,
              "battery": GREEN,
              "storage": GREEN,
              "health": GREEN,
              "status": GREEN,

              "reporter": WHITE,
              "location": WHITE,
              "time": WHITE,
              "date": WHITE
          }

          for key, colour in colour_rules.items():

              pattern = (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*'
                  + re.escape(key)
                  + r'[A-Za-z0-9_]*'
                  r'\.color\s*=\s*)'
                  r'[^\n]+'
              )

              text = re.sub(
                  pattern,
                  lambda m:
                      m.group(1) + colour,
                  text,
                  flags=re.IGNORECASE
              )

          # --------------------------------------------------
          # G. KEEP TEXT READABLE DIRECTLY OVER VIDEO
          #
          # Only a subtle shadow — never a box.
          # --------------------------------------------------

          text = text.replace(
              "setShadowLayer(0f",
              "setShadowLayer(1.2f"
          )

          if text == before:

              raise SystemExit(
                  "Telemetry renderer was not modified"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Phase 10 final telemetry HUD applied"
          )
          PY

      # ============================================================
      # CREATE PROFESSIONAL LIVE CAMERA CHROME
      #
      # This is for the CAMERA SCREEN only.
      # It is not part of the saved-video burn-in.
      #
      # Adds:
      # - rule-of-thirds grid
      # - horizon
      # - centre focus reticle
      # - frame corner marks
      # - small PRO CAM status
      #
      # No dark panel.
      # ============================================================

      - name: Create professional camera monitor overlay
        run: |
          cat > \
          phase10-build/pulse-phase4-production/app/src/main/java/com/sentongoharuna/pulse/Phase10ProChromeView.kt \
          <<'KOTLIN'
          package com.sentongoharuna.pulse

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View

          class Phase10ProChromeView(
              context: Context
          ) : View(context) {

              private val density =
                  resources.displayMetrics.density

              private val gridPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {

                      color =
                          Color.argb(
                              72,
                              255,
                              255,
                              255
                          )

                      strokeWidth =
                          density * 0.55f

                      style =
                          Paint.Style.STROKE
                  }

              private val horizonPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {

                      color =
                          Color.argb(
                              160,
                              255,
                              193,
                              7
                          )

                      strokeWidth =
                          density * 0.9f

                      style =
                          Paint.Style.STROKE
                  }

              private val focusPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {

                      color =
                          Color.argb(
                              205,
                              0,
                              229,
                              255
                          )

                      strokeWidth =
                          density * 1.0f

                      style =
                          Paint.Style.STROKE
                  }

              private val cornerPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {

                      color =
                          Color.argb(
                              150,
                              255,
                              255,
                              255
                          )

                      strokeWidth =
                          density * 1.0f

                      style =
                          Paint.Style.STROKE
                  }

              override fun onDraw(
                  canvas: Canvas
              ) {

                  super.onDraw(canvas)

                  val w =
                      width.toFloat()

                  val h =
                      height.toFloat()

                  if (
                      w <= 0f ||
                      h <= 0f
                  ) {
                      return
                  }

                  // ----------------------------------------
                  // Rule of thirds
                  // ----------------------------------------

                  canvas.drawLine(
                      w / 3f,
                      0f,
                      w / 3f,
                      h,
                      gridPaint
                  )

                  canvas.drawLine(
                      w * 2f / 3f,
                      0f,
                      w * 2f / 3f,
                      h,
                      gridPaint
                  )

                  canvas.drawLine(
                      0f,
                      h / 3f,
                      w,
                      h / 3f,
                      gridPaint
                  )

                  canvas.drawLine(
                      0f,
                      h * 2f / 3f,
                      w,
                      h * 2f / 3f,
                      gridPaint
                  )

                  // ----------------------------------------
                  // Centre horizon
                  // ----------------------------------------

                  val horizonWidth =
                      w * 0.22f

                  canvas.drawLine(
                      (w / 2f) - horizonWidth,
                      h / 2f,
                      (w / 2f) - (density * 8f),
                      h / 2f,
                      horizonPaint
                  )

                  canvas.drawLine(
                      (w / 2f) + (density * 8f),
                      h / 2f,
                      (w / 2f) + horizonWidth,
                      h / 2f,
                      horizonPaint
                  )

                  canvas.drawLine(
                      w / 2f,
                      (h / 2f) - (density * 4f),
                      w / 2f,
                      (h / 2f) + (density * 4f),
                      horizonPaint
                  )

                  // ----------------------------------------
                  // Centre focus reticle
                  // ----------------------------------------

                  val r =
                      density * 18f

                  canvas.drawRect(
                      RectF(
                          (w / 2f) - r,
                          (h / 2f) - r,
                          (w / 2f) + r,
                          (h / 2f) + r
                      ),
                      focusPaint
                  )

                  // ----------------------------------------
                  // Professional frame corners
                  // ----------------------------------------

                  val margin =
                      density * 18f

                  val length =
                      density * 22f

                  // Top left
                  canvas.drawLine(
                      margin,
                      margin,
                      margin + length,
                      margin,
                      cornerPaint
                  )

                  canvas.drawLine(
                      margin,
                      margin,
                      margin,
                      margin + length,
                      cornerPaint
                  )

                  // Top right
                  canvas.drawLine(
                      w - margin,
                      margin,
                      w - margin - length,
                      margin,
                      cornerPaint
                  )

                  canvas.drawLine(
                      w - margin,
                      margin,
                      w - margin,
                      margin + length,
                      cornerPaint
                  )

                  // Bottom left
                  canvas.drawLine(
                      margin,
                      h - margin,
                      margin + length,
                      h - margin,
                      cornerPaint
                  )

                  canvas.drawLine(
                      margin,
                      h - margin,
                      margin,
                      h - margin - length,
                      cornerPaint
                  )

                  // Bottom right
                  canvas.drawLine(
                      w - margin,
                      h - margin,
                      w - margin - length,
                      h - margin,
                      cornerPaint
                  )

                  canvas.drawLine(
                      w - margin,
                      h - margin,
                      w - margin,
                      h - margin - length,
                      cornerPaint
                  )
              }
          }
          KOTLIN

      # ============================================================
      # PROFESSIONAL LIVE CAMERA LOOK
      #
      # Style existing controls.
      # Do NOT remove their existing click handlers.
      # ============================================================

      - name: Apply develop.uganda professional camera UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "phase10-build/pulse-phase4-production/"
              "app/src/main/java/com/sentongoharuna/pulse/"
              "LiveActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          call_name = (
              "applyPhase10FinalCameraLook()"
          )

          if call_name not in text:

              marker = (
                  "super.onCreate(savedInstanceState)"
              )

              if marker not in text:

                  raise SystemExit(
                      "LiveActivity onCreate was not found"
                  )

              text = text.replace(
                  marker,
                  marker +
                  "\n        " +
                  call_name,
                  1
              )

              methods = r'''

          private fun applyPhase10FinalCameraLook() {

              window.decorView.postDelayed({

                  stylePhase10ControlTree(
                      window.decorView
                  )

                  addPhase10ProfessionalChrome()

              }, 450L)
          }

          private fun stylePhase10ControlTree(
              view: android.view.View
          ) {

              if (
                  view is android.widget.TextView
              ) {

                  val label =
                      view.text
                          ?.toString()
                          ?.trim()
                          ?.uppercase()
                          ?: ""

                  val controlNames =
                      setOf(
                          "REPORT",
                          "PRO",
                          "AUTO",
                          "PHOTO",
                          "VIDEO",
                          "LIVE",
                          "DATA",
                          "FLIP",
