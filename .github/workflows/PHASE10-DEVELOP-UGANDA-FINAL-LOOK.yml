      # ============================================================
      # SAFE REC WORDING
      #
      # Fixes the Python syntax mistake from Phase 8.
      # ============================================================

      - name: Apply professional REC labels safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "phase10-build/pulse-phase4-production/"
              "app/src/main/java/com/sentongoharuna/pulse"
          )

          string_pattern = re.compile(
              r'"(?:\\.|[^"\\])*"'
          )

          for path in root.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              def replace_label(match):

                  token = match.group(0)
                  value = token[1:-1]

                  if value == "RECORD":
                      return '"● REC"'

                  if value == "STOP RECORD":
                      return '"■ STOP"'

                  return token

              text = string_pattern.sub(
                  replace_label,
                  text
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Professional REC wording applied"
          )
          PY

