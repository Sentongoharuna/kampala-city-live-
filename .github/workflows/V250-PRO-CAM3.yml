name: Build develop.uganda V250 PRO CAM3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V250-PRO-CAM3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout full repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install workflow replay helper
      run: python3 -m pip install --quiet pyyaml

    - name: Replay verified V250 PRO CAM2 source pipeline
      run: |
        set -e
        python3 - <<'PY'
        from pathlib import Path
        import os
        import subprocess
        import yaml

        root = Path.cwd()
        source = root / ".github/workflows/V250-PRO-CAM2.yml"
        if not source.exists():
            raise SystemExit("V250 PRO CAM2 workflow is missing")

        data = yaml.safe_load(source.read_text(encoding="utf-8"))
        steps = data["jobs"]["build"]["steps"]

        replayed = 0
        for step in steps:
            name = str(step.get("name", ""))
            if name == "Set up Java 17":
                break

            command = step.get("run")
            if not command:
                continue

            cwd = root
            working = step.get("working-directory")
            if working:
                cwd = root / working

            env = os.environ.copy()
            for key, value in (step.get("env") or {}).items():
                env[str(key)] = str(value)

            print(f"REPLAY: {name}", flush=True)
            subprocess.run(["bash", "-lc", command], cwd=str(cwd), env=env, check=True)
            replayed += 1

        if replayed < 3:
            raise SystemExit(f"Unexpectedly replayed only {replayed} CAM2 run steps")

        print(f"PASS: replayed {replayed} verified CAM2 source steps.")
        PY

    - name: Apply V250 PRO CAM3 clean deck patch
      run: |
        set -e
        echo '' | base64 -d > /tmp/v250_cam3_patch.py
        python3 -m py_compile /tmp/v250_cam3_patch.py
        python3 /tmp/v250_cam3_patch.py

        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        PRO="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt"
        PANEL="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV244CinemaControl.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'identityRow.visibility = View.GONE' "$CAMERA"
        grep -q 'visibility = View.GONE' "$PRO"
        grep -q 'dp(360)' "$PRO"
        grep -q 'background = null' "$PRO"
        grep -q 'V250 PRO CAM3' "$CAMERA"
        grep -q 'V250 • PRO CAM3' "$PANEL"
        grep -q 'develop.uganda • V250 PRO CAM3' "$HOME"
        grep -q 'versionCode = 25003' "$GRADLE"
        grep -q 'versionName = "250.3-pro-cam3"' "$GRADLE"

        # Protected camera systems must remain present.
        grep -q 'v249ToggleReporterTags' "$CAMERA"
        grep -q 'smoothZoomToTarget' "$PRO"
        grep -q 'v248ShutterTag' "$CAMERA"
        grep -q 'v247ApplyAdaptiveDetail' "$CAMERA"
        grep -q 'v246ApplyCinemaImageEngine' "$CAMERA"
        grep -q 'v245MasterQualityStatus' "$CAMERA"
        grep -q 'verifyV242GalleryMaster' "$CAMERA"

        echo "PASS: V250 PRO CAM3 verified before Android compilation."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V250 PRO CAM3 APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v250-pro-cam3-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v250-pro-cam3-build.log | head -5000 || true

    - name: Prepare V250 PRO CAM3 artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V250-PRO-CAM3.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V250-PRO-CAM3-SOURCE.zip app
        cd ..

    - name: Upload V250 PRO CAM3 APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V250-PRO-CAM3
        path: DEVELOP-UGANDA-V250-PRO-CAM3.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload V250 PRO CAM3 source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V250-PRO-CAM3-SOURCE
        path: DEVELOP-UGANDA-V250-PRO-CAM3-SOURCE.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload V250 PRO CAM3 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V250-PRO-CAM3-BUILD-LOG
        path: v172-source/v250-pro-cam3-build.log
        if-no-files-found: warn
        retention-days: 7
