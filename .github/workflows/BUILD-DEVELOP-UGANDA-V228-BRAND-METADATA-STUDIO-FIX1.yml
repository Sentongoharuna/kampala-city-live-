name: Build develop.uganda V228 Brand Metadata Studio FIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V227 base and V228 patch
        run: |
          set -e

          PATCH="DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-PATCH.zip"
          GRADLE="v172-source/app/build.gradle.kts"
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"

          test -f "$PATCH"
          grep -q 'versionCode = 22700' "$GRADLE"
          grep -q 'versionName = "227.0-director-qc-pro"' "$GRADLE"

          test -f "$SRC/DevelopUgandaDirectorOverlayView.kt"
          test -f "$SRC/DevelopUgandaClipQc.kt"
          test -f "$SRC/DevelopUgandaContinuityMemory.kt"
          test -f "$SRC/DevelopUgandaLensIntelligence.kt"
          test -f "$SRC/DevelopUgandaCameraHealthActivity.kt"
          test -f "$SRC/DevelopUgandaMediaInbox.kt"
          test -f "$SRC/DevelopUgandaStoryPlayerActivity.kt"

          echo "PASS: V227 Director/QC + V226 FIX2 base confirmed."

      - name: Unpack and syntax-check V228
        run: |
          set -e

          rm -rf /tmp/v228
          mkdir -p /tmp/v228

          unzip -q DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-PATCH.zip -d /tmp/v228

          python3 -m py_compile /tmp/v228/v228_patch.py

          test -f /tmp/v228/DevelopUgandaBrandMetadataStore.kt
          test -f /tmp/v228/DevelopUgandaBrandMetadataActivity.kt
          test -f /tmp/v228/report_v228_overlay.txt
          test -f /tmp/v228/live_v228_overlay.txt

          echo "PASS: V228 patch package is complete."

      - name: Lock V227 and V226 protected systems
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")

          protected_files = {
              "director": SRC / "DevelopUgandaDirectorOverlayView.kt",
              "clip_qc": SRC / "DevelopUgandaClipQc.kt",
              "continuity": SRC / "DevelopUgandaContinuityMemory.kt",
              "lens": SRC / "DevelopUgandaLensIntelligence.kt",
              "health": SRC / "DevelopUgandaCameraHealthActivity.kt",
              "media_inbox": SRC / "DevelopUgandaMediaInbox.kt",
              "story_player": SRC / "DevelopUgandaStoryPlayerActivity.kt",
          }

          def function_block(path, function_name):
              text = path.read_text(encoding="utf-8")
              marker = f"fun {function_name}"
              start = text.index(marker)
              line_start = text.rfind("\n", 0, start) + 1
              brace = text.index("{", start)

              depth = 0
              quote = None
              escaped = False

              for i in range(brace, len(text)):
                  ch = text[i]

                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      continue

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[line_start:i + 1]

              raise RuntimeError(f"Function not closed: {function_name}")

          saved = {}

          for name, path in protected_files.items():
              saved[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          for key, filename in [
              ("report_bind", "DevelopUgandaCameraActivity.kt"),
              ("live_bind", "DevelopUgandaLiveActivity.kt"),
              ("photo_bind", "DevelopUgandaPhotoSuiteActivity.kt"),
          ]:
              saved[key] = hashlib.sha256(
                  function_block(SRC / filename, "bindCamera").encode()
              ).hexdigest()

          Path("/tmp/v228-fix1-protected.json").write_text(
              json.dumps(saved),
              encoding="utf-8"
          )

          print("PASS: protected V227/V226 fingerprints saved.")
          PY

      - name: Apply V228 Brand Metadata Studio
        run: |
          set -e
          python3 /tmp/v228/v228_patch.py

      - name: Prove V227 and V226 protected systems remain
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          before = json.loads(
              Path("/tmp/v228-fix1-protected.json").read_text(encoding="utf-8")
          )

          protected_files = {
              "director": SRC / "DevelopUgandaDirectorOverlayView.kt",
              "clip_qc": SRC / "DevelopUgandaClipQc.kt",
              "continuity": SRC / "DevelopUgandaContinuityMemory.kt",
              "lens": SRC / "DevelopUgandaLensIntelligence.kt",
              "health": SRC / "DevelopUgandaCameraHealthActivity.kt",
              "media_inbox": SRC / "DevelopUgandaMediaInbox.kt",
              "story_player": SRC / "DevelopUgandaStoryPlayerActivity.kt",
          }

          def function_block(path, function_name):
              text = path.read_text(encoding="utf-8")
              marker = f"fun {function_name}"
              start = text.index(marker)
              line_start = text.rfind("\n", 0, start) + 1
              brace = text.index("{", start)

              depth = 0
              quote = None
              escaped = False

              for i in range(brace, len(text)):
                  ch = text[i]

                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      continue

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[line_start:i + 1]

              raise RuntimeError(f"Function not closed: {function_name}")

          current = {}

          for name, path in protected_files.items():
              current[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          for key, filename in [
              ("report_bind", "DevelopUgandaCameraActivity.kt"),
              ("live_bind", "DevelopUgandaLiveActivity.kt"),
              ("photo_bind", "DevelopUgandaPhotoSuiteActivity.kt"),
          ]:
              current[key] = hashlib.sha256(
                  function_block(SRC / filename, "bindCamera").encode()
              ).hexdigest()

          failures = [
              name
              for name, old_hash in before.items()
              if current.get(name) != old_hash
          ]

          if failures:
              raise SystemExit(
                  "Protected V227/V226 systems changed unexpectedly: " +
                  ", ".join(failures)
              )

          print("PASS: V227 Director/QC/continuity/lens/health retained.")
          print("PASS: REPORT/LIVE/PHOTO CameraX bind engines retained.")
          print("PASS: V226 FIX2 MediaStore inbox and internal player retained.")
          PY

      - name: Verify V228 implementation with named checks
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          SRC = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")

          files = {
              "store": SRC / "DevelopUgandaBrandMetadataStore.kt",
              "studio": SRC / "DevelopUgandaBrandMetadataActivity.kt",
              "report": SRC / "DevelopUgandaCameraActivity.kt",
              "live": SRC / "DevelopUgandaLiveActivity.kt",
              "review": SRC / "DevelopUgandaInstantReviewDialog.kt",
              "packager": SRC / "DevelopUgandaStoryPackager.kt",
              "home": SRC / "DevelopUgandaNewsroomActivity.kt",
              "manifest": Path("v172-source/app/src/main/AndroidManifest.xml"),
              "gradle": Path("v172-source/app/build.gradle.kts"),
          }

          for label, path in files.items():
              if not path.exists():
                  raise SystemExit(f"FAIL [{label}]: missing {path}")

          text = {
              label: path.read_text(encoding="utf-8")
              for label, path in files.items()
          }

          checks = [
              ("store-tag-enum", "store", "enum class Tag"),
              ("store-gps", "store", "GPS_COORDS"),
              ("store-shot-guard", "store", "SHOT_GUARD"),
              ("store-full-forensic", "store", "PRESET_FULL_FORENSIC"),
              ("store-social-clean", "store", "PRESET_SOCIAL_CLEAN"),
              ("store-verified-master", "store", "OUTPUT_VERIFIED_MASTER"),
              ("store-public-social", "store", "OUTPUT_PUBLIC_SOCIAL"),

              ("studio-screen", "studio", "BRAND & METADATA STUDIO"),
              ("studio-reporter-name", "studio", "USE SAVED REPORTER NAME"),
              ("studio-save-custom", "studio", "SAVE CUSTOM BRAND + TAGS"),
              ("studio-visible-tags", "studio", "VISIBLE SAVED-VIDEO TAGS"),

              ("report-store", "report", "DevelopUgandaBrandMetadataStore"),
              ("report-display-name", "report", "brandConfig.displayName"),
              ("report-gps-tag", "report", "Tag.GPS_COORDS"),
              ("report-shot-guard-tag", "report", "Tag.SHOT_GUARD"),
              ("report-brand-action", "report", "ACTION_BRAND_METADATA"),
              ("report-brand-studio", "report", "openV228BrandMetadataStudio"),

              ("live-store", "live", "DevelopUgandaBrandMetadataStore"),
              ("live-display-name", "live", "brandConfig.displayName"),
              ("live-reporter-tag", "live", "Tag.REPORTER"),
              ("live-story-tag", "live", "Tag.STORY"),
              ("live-camera-mode-tag", "live", "Tag.CAMERA_MODE"),

              ("review-privacy", "review", "PRIVACY CHECK • EXACT GPS VISIBLE"),
              ("review-gps-check", "review", "exactGpsVisible"),
              ("review-share-now", "review", "shareNow"),

              ("package-brand-json", "packager", "BRAND_METADATA.json"),
              ("package-brand-name", "packager", "brand_display_name"),
              ("package-brand-preset", "packager", "brand_overlay_preset"),
              ("package-brand-output", "packager", "brand_output_profile"),
              ("package-caption-credit", "packager", "Recorded with develop.uganda • V228"),

              ("home-v228", "home", "V228 • BRAND & METADATA"),
              ("manifest-studio", "manifest", ".DevelopUgandaBrandMetadataActivity"),
              ("version-code", "gradle", "versionCode = 22800"),
              ("version-name", "gradle", 'versionName = "228.0-brand-metadata-studio"'),
          ]

          failed = []

          for label, file_key, needle in checks:
              if needle in text[file_key]:
                  print(f"PASS [{label}]")
              else:
                  print(f"FAIL [{label}] missing: {needle}")
                  failed.append(label)

          if failed:
              raise SystemExit(
                  "V228 verification failed only for: " +
                  ", ".join(failed)
              )

          print("PASS: V228 implementation verified with named checks.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V228 FIX1 APK before commit
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v228-fix1-build.log

      - name: Print exact Kotlin compiler errors and context
        if: failure()
        working-directory: v172-source
        run: |
          if [ ! -f v228-fix1-build.log ]; then
            echo "Gradle did not start."
            exit 0
          fi

          echo "===== V228 FIX1 IMPORTANT ERRORS ====="

          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v228-fix1-build.log | head -5000 || true

          echo "===== SOURCE CONTEXT ====="

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v228-fix1-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          matches = re.findall(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)',
              log
          )

          seen = set()

          for filename, line_text, col in matches:
              key = (filename, line_text)
              if key in seen:
                  continue
              seen.add(key)

              if len(seen) > 45:
                  break

              line_no = int(line_text)
              matches = list(Path("app/src/main/java").rglob(filename))

              if not matches:
                  continue

              path = matches[0]
              lines = path.read_text(encoding="utf-8").splitlines()

              print(f"\nFILE: {path}  LINE: {line_no}")

              for n in range(
                  max(1, line_no - 45),
                  min(len(lines), line_no + 80) + 1
              ):
                  mark = ">>" if n == line_no else "  "
                  print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Commit V228 only after successful APK build
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaPhotoSuiteActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStoryPackager.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInstantReviewDialog.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBrandMetadataStore.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBrandMetadataActivity.kt \
            v172-source/app/src/main/AndroidManifest.xml \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V228 source already committed."
          else
            git commit -m "Add develop.uganda V228 Brand Metadata Studio FIX1"
            git push
          fi

      - name: Package successful V228 source
        run: |
          cd v172-source
          zip -qr ../DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1-SOURCE.zip app
          cd ..

      - name: Prepare V228 APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1.apk

      - name: Upload V228 APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1
          path: DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V228 source
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1-SOURCE
          path: DEVELOP-UGANDA-V228-BRAND-METADATA-STUDIO-FIX1-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload V228 build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V228-FIX1-BUILD-LOG
          path: v172-source/v228-fix1-build.log
          if-no-files-found: warn
          retention-days: 7
