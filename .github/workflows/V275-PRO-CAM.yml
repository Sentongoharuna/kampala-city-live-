      - name: Verify V275 preservation and version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 27500' v172-source/app/build.gradle.kts
          grep -q 'versionName = "275.0-control-surface-dual-settings"' v172-source/app/build.gradle.kts
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV271LiveCoach.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV272FieldSoundContinuity.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV273MotionShotControl.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV274MediaVault.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV262RemoteDirector.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV263MultiCamDirector.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV264LiveCutDirector.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV265ProxySyncReview.kt
          grep -q 'DevelopUgandaV274MediaVaultActivity' v172-source/app/src/main/AndroidManifest.xml
          grep -q 'DevelopUgandaV274MediaVaultStore.onClipFinalized' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV275ControlSurface.kt
          grep -q 'DevelopUgandaV275CameraSettingsActivity' v172-source/app/src/main/AndroidManifest.xml
          grep -q 'DevelopUgandaV275WorkflowSettingsActivity' v172-source/app/src/main/AndroidManifest.xml
          grep -q 'V275 • CONTROL SURFACE + DUAL SETTINGS' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt
          grep -q 'V275 LIVE CONTROL SURFACE' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt
          echo 'PASS: V271–V274 cumulative layers preserved and V275 wired.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V275 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v275-build.log

      - name: Print compiler errors if build fails
        if: failure()
        working-directory: v172-source
        shell: bash
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v275-build.log | head -5000 || true

      - name: Prepare V275 APK
        if: success()
        run: cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V275-PRO-CAM.apk

      - name: Upload V275 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V275-PRO-CAM
          path: DEVELOP-UGANDA-V275-PRO-CAM.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V275 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V275-BUILD-LOG
          path: v172-source/v275-build.log
          if-no-files-found: warn
          retention-days: 7
