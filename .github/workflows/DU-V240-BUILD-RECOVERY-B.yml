name: Build develop.uganda V240 Home Hub Recovery B

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/DU-V240-BUILD-RECOVERY-B.yml'
      - 'DU-V240-HOME-RECOVERY-B.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V239 or V240 base
        run: |
          set -e
          PATCH="DU-V240-HOME-RECOVERY-B.py"
          GRADLE="v172-source/app/build.gradle.kts"
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          test -f "$PATCH"
          python3 -m py_compile "$PATCH"
          test -f "$GRADLE"
          test -f "$SRC/DevelopUgandaCameraActivity.kt"
          test -f "$SRC/DevelopUgandaProCameraHud.kt"
          test -f "$SRC/DevelopUgandaFieldIntelligencePanel.kt"
          test -f "$SRC/DevelopUgandaEverydayColorMixer.kt"
          if grep -q 'versionCode = 24010' "$GRADLE"; then
            echo "PASS: V240.1 recovery rebuild base found."
          elif grep -q 'versionCode = 24010' "$GRADLE"; then
            echo "PASS: V240 Home Hub base found."
          elif grep -q 'versionCode = 23900' "$GRADLE"; then
            echo "PASS: V239 base found."
          else
            echo "Unsupported base version:"
            grep -E 'versionCode|versionName' "$GRADLE" || true
            exit 1
          fi

      - name: Lock protected camera engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          names = [
              "DevelopUgandaColorEngine.kt",
              "DevelopUgandaColorTuner.kt",
              "DevelopUgandaEverydayColorMixer.kt",
              "DevelopUgandaLiveGradePanel.kt",
              "DevelopUgandaFieldIntelligencePanel.kt",
              "DevelopUgandaAdaptiveFormatUi.kt",
              "DevelopUgandaOperatorExperience.kt",
          ]
          data = {n: hashlib.sha256((src / n).read_bytes()).hexdigest() for n in names}
          Path('/tmp/v240-lock.json').write_text(json.dumps(data))
          print('PASS: protected camera engine fingerprints saved')
          PY

      - name: Apply V240 Home Hub
        run: python3 DU-V240-HOME-RECOVERY-B.py

      - name: Prove camera engines unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          data = json.loads(Path('/tmp/v240-lock.json').read_text())
          for name, expected in data.items():
              actual = hashlib.sha256((src / name).read_bytes()).hexdigest()
              assert actual == expected, f"Protected engine changed: {name}"
          print('PASS: V235-V239 camera engines retained exactly')
          PY

      - name: Verify V240 Home Hub
        run: |
          set -e
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          HOME="$SRC/DevelopUgandaHomeActivity.kt"
          MANIFEST="v172-source/app/src/main/AndroidManifest.xml"
          STORY="$SRC/DevelopUgandaStoryPackager.kt"
          GRADLE="v172-source/app/build.gradle.kts"
          test -f "$HOME"
          grep -q 'ONE HOME • EVERY CAMERA TOOL' "$HOME"
          grep -q 'YOUTUBE' "$HOME"
          grep -q 'SHORTS' "$HOME"
          grep -q 'SATELLITE FIELD CAMERA' "$HOME"
          grep -q 'HOME EXPERIENCE' "$HOME"
          grep -q 'DevelopUgandaHomeActivity' "$MANIFEST"
          grep -q 'versionCode = 24010' "$GRADLE"
          grep -q 'versionName = "240.1-home-hub-recovery"' "$GRADLE"
          grep -q '.put("app_version", "V240")' "$STORY"
          grep -q 'develop_uganda_v240_enable_v239_hud' "$SRC/DevelopUgandaProCameraHud.kt"
          echo "PASS: V240.1 Home Hub + camera recovery verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V240 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v240-build.log

      - name: Print useful compiler errors
        if: failure()
        working-directory: v172-source
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v240-build.log | head -5000 || true

      - name: Commit V240 after successful build
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v172-source/app README-V240-HOME-HUB.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Add develop.uganda V240 Home Hub camera recovery"
            git push
          fi

      - name: Prepare V240 artifacts
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V240-HOME-RECOVERY-B.apk
          cd v172-source && zip -qr ../DEVELOP-UGANDA-V240-HOME-RECOVERY-B-SOURCE.zip app && cd ..

      - name: Upload V240 APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V240-HOME-RECOVERY-B
          path: DEVELOP-UGANDA-V240-HOME-RECOVERY-B.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V240 source
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V240-HOME-RECOVERY-B-SOURCE
          path: DEVELOP-UGANDA-V240-HOME-RECOVERY-B-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload V240 build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V240-HOME-RECOVERY-B-BUILD-LOG
          path: v172-source/v240-build.log
          if-no-files-found: warn
          retention-days: 7
