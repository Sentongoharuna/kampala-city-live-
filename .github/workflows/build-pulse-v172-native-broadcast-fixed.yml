name: Build PULSE V172 Native Broadcast FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify V172 fixed source ZIP exists
        run: test -f pulse-v172-native-android-project-fixed.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Unpack V172 fixed native project
        run: |
          rm -rf pulse-v172-fixed-build
          mkdir pulse-v172-fixed-build
          unzip -q pulse-v172-native-android-project-fixed.zip -d pulse-v172-fixed-build
          test -f pulse-v172-fixed-build/gradle.properties
          grep -q "android.useAndroidX=true" pulse-v172-fixed-build/gradle.properties

      - name: Build V172 fixed debug APK
        working-directory: pulse-v172-fixed-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp pulse-v172-fixed-build/app/build/outputs/apk/debug/app-debug.apk PULSE-V172-BROADCAST-REPORTER-FIXED.apk
          ls -lh PULSE-V172-BROADCAST-REPORTER-FIXED.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-V172-BROADCAST-REPORTER-FIXED
          path: PULSE-V172-BROADCAST-REPORTER-FIXED.apk
          if-no-files-found: error
          retention-days: 14
