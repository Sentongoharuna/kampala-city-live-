          ! grep -q 'DevelopUgandaDfv238CameraShell.attach' "$CAMERA"

          echo "PASS: V242 verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V242 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v242-build.log

      - name: Print compiler errors
        if: failure()
        working-directory: v172-source
        run: |
          grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' \
            v242-build.log | head -5000 || true

      - name: Prepare V242 artifacts
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO.apk

          cd v172-source
          zip -qr ../DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO-SOURCE.zip app
          cd ..

      - name: Upload V242 APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO
          path: DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V242 source
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO-SOURCE
          path: DEVELOP-UGANDA-V242-QUALITY-MATCH-PRO-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload V242 build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V242-QUALITY-MATCH-PRO-BUILD-LOG
          path: v172-source/v242-build.log
          if-no-files-found: warn
          retention-days: 7
