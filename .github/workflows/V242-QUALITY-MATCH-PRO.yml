          grep -q 'ASPECT •' "$FIELD"
          grep -q 'Gravity.TOP or (if (start) Gravity.START else Gravity.END)' "$ADAPT"
          grep -q 'gradeBaseline = View.VISIBLE' "$OP"
          grep -q 'fieldBaseline = View.VISIBLE' "$OP"
