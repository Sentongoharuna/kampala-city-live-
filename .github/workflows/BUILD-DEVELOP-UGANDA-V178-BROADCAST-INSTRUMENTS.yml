name: Build develop.uganda V178 Broadcast Instruments

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V178 source
        run: |
          set -e
          test -f DevelopUgandaCameraActivityV178.kt
          test -d v172-source
          echo "V178 source found"

      - name: Install V178 direct source
        run: |
          set -e

          cp DevelopUgandaCameraActivityV178.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("v172-source/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 17800',
              text,
              count=1
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "178.0-broadcast-instruments"',
              text,
              count=1
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify V178 features
        run: |
          set -e
          FILE="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"

          grep -q 'REPORT ID $reportId' "$FILE"
          grep -q 'finalWidth \* 0.24f' "$FILE"
          grep -q 'GnssStatus.Callback' "$FILE"
          grep -q 'SAT ${gnssSatellitesUsed}/${gnssSatellitesVisible}' "$FILE"
          grep -q 'Sensor.TYPE_ROTATION_VECTOR' "$FILE"
          grep -q 'HORIZON %.1f°' "$FILE"
          grep -q 'audioStats.audioAmplitude' "$FILE"
          grep -q 'showIdentityDialog' "$FILE"
          grep -q 'makeRecordButton' "$FILE"

          echo "V178 telemetry and identity features verified"

      - name: Commit V178 actual source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V178 source already committed"
          else
            git commit -m "Add V178 broadcast instruments and safe HUD"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V178 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v178-build.log

      - name: Print exact Kotlin error and source context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v178-build.log \
            | head -300 \
            || true

          echo "===== SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v178-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )
          m = re.search(
              r'DevelopUgandaCameraActivity\.kt:(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          line_no = int(m.group(1))
          src = Path(
              "app/src/main/java/com/sentongoharuna/pulse/"
              "DevelopUgandaCameraActivity.kt"
          )
          lines = src.read_text(encoding="utf-8").splitlines()

          for n in range(
              max(1, line_no - 10),
              min(len(lines), line_no + 14) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V178-BROADCAST-INSTRUMENTS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V178-BROADCAST-INSTRUMENTS
          path: DEVELOP-UGANDA-V178-BROADCAST-INSTRUMENTS.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V178-BUILD-LOG
          path: v172-source/v178-build.log
          if-no-files-found: warn
          retention-days: 7
