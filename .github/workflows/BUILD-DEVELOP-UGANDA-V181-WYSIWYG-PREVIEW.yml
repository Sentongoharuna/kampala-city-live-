name: Build develop.uganda V181 WYSIWYG Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V181 source
        run: |
          set -e
          test -f DevelopUgandaCameraActivityV181.kt
          test -d v172-source
          echo "V181 source found"

      - name: Install V181 direct source
        run: |
          set -e

          cp DevelopUgandaCameraActivityV181.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("v172-source/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'versionCode\s*=\s*\d+',
              'versionCode = 18100',
              text,
              count=1
          )
          text = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "181.0-wysiwyg-preview"',
              text,
              count=1
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify V181 preview fix
        run: |
          set -e
          FILE="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"

          grep -q 'PreviewView.ScaleType.FIT_START' "$FILE"
          grep -q 'w \* (16f / 9f)' "$FILE"
          grep -q 'frameH - dp(1)' "$FILE"
          grep -q 'finalWidth \* 0.19f' "$FILE"
          grep -q 'finalWidth \* 0.69f' "$FILE"
          grep -q 'makeRecordButton' "$FILE"

          echo "V181 full-frame preview fix verified"

      - name: Commit V181 source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V181 source already committed"
          else
            git commit -m "Fix V181 live preview to show complete 9x16 frame"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V181 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v181-build.log

      - name: Print exact error context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v181-build.log \
            | head -300 \
            || true

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V181-WYSIWYG-PREVIEW.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V181-WYSIWYG-PREVIEW
          path: DEVELOP-UGANDA-V181-WYSIWYG-PREVIEW.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V181-BUILD-LOG
          path: v172-source/v181-build.log
          if-no-files-found: warn
          retention-days: 7
