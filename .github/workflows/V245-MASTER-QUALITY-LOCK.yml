        \ = FloatArray(cols * rows)\n\n            for (y in 0 until rows) {\n                for (x in 0 until cols) {\n\
        \                    val c = scaled.getPixel(x, y)\n                    next[y * cols + x] =\n                   \
        \     (\n                            (\n                                0.2126f * Color.red(c) +\n               \
        \                 0.7152f * Color.green(c) +\n                                0.0722f * Color.blue(c)\n          \
        \                  ) / 255f\n                        ).coerceIn(0f, 1f)\n                }\n            }\n\n    \
        \        luma = next\n            scaled.recycle()\n            invalidate()\n        }\n\n        override fun onDraw(canvas:\
        \ Canvas) {\n            super.onDraw(canvas)\n            val d = resources.displayMetrics.density\n            val\
