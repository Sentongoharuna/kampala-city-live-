name: Build develop.uganda V245 Master Quality Lock

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V245-MASTER-QUALITY-LOCK.yml'

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout full repository history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Restore verified V238 master camera
      run: 'set -e

        V238_COMMIT="394049029eca20367cab1ce9628fc1dbe489dd7a"

        git restore --source="$V238_COMMIT" --staged --worktree v172-source/app

        rm -rf v172-source/app/build

        rm -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDfv238CameraShell.kt


        grep -q ''versionCode = 23800'' v172-source/app/build.gradle.kts

        grep -q ''versionName = "238.0-operator-experience-pro"'' v172-source/app/build.gradle.kts


        echo "PASS: exact verified V238 camera restored."

        '
    - name: Fingerprint protected LUT engine
      run: "set -e\npython3 - <<'PY'\nfrom pathlib import Path\nimport hashlib, json\n\nsrc = Path(\"v172-source/app/src/main/java/com/sentongoharuna/pulse\"\
        )\nprotected = [\n    \"DevelopUgandaColorEngine.kt\",\n    \"DevelopUgandaColorTuner.kt\",\n    \"DevelopUgandaEverydayColorMixer.kt\"\
        ,\n    \"DevelopUgandaNavySheet.kt\",\n]\n\ndata = {\n    name: hashlib.sha256((src / name).read_bytes()).hexdigest()\n\
        \    for name in protected\n}\nPath(\"/tmp/v242-lut-lock.json\").write_text(\n    json.dumps(data, indent=2),\n  \
        \  encoding=\"utf-8\"\n)\nprint(\"PASS: V235 LUT engine locked.\")\nPY\n"
    - name: Apply dfv238 safe camera format
      run: "set -e\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\n\nSRC = Path(\"v172-source/app/src/main/java/com/sentongoharuna/pulse\"\
        )\nCAMERA = SRC / \"DevelopUgandaCameraActivity.kt\"\nOP = SRC / \"DevelopUgandaOperatorExperience.kt\"\nADAPT = SRC\
        \ / \"DevelopUgandaAdaptiveFormatUi.kt\"\nLUT = SRC / \"DevelopUgandaLiveGradePanel.kt\"\nFIELD = SRC / \"DevelopUgandaFieldIntelligencePanel.kt\"\
        \n\n# LUT button wording only. No LUT algorithm changes.\ntext = LUT.read_text(encoding=\"utf-8\")\ntext = text.replace(\n\
        \    'text = \"GRADE • V235\\\\nMIX ▸\"',\n    'text = \"LUTS • V235\\\\nMIX ▸\"'\n)\ntext = text.replace(\n    '\"\
        GRADE • ${selection.strength}%\\\\n${name.take(12)} ▸\"',\n    '\"LUTS • ${selection.strength}%\\\\n${name.take(12)}\
        \ ▸\"'\n)\nif \"LUTS •\" not in text:\n    raise SystemExit(\"V242: LUTS label not applied\")\nLUT.write_text(text,\
        \ encoding=\"utf-8\")\n\n# Keep the exact working V236 format string.\n# Only add the visible ASPECT prefix; do not\
        \ reconstruct \\nSAT...\ntext = FIELD.read_text(encoding=\"utf-8\")\nold_aspect_start = r'''\"${if (format.landscape)\
        \ \"16:9\" else format.id.substringAfter('_').replace('_', ':')} • ${if (format.dualSafe) \"DUAL\" else \"LOCK\"}\\\
        nSAT $satUsed/$satVisible • $level\"'''\nnew_aspect_start = r'''\"ASPECT • ${if (format.landscape) \"16:9\" else format.id.substringAfter('_').replace('_',\
        \ ':')} • ${if (format.dualSafe) \"DUAL\" else \"LOCK\"}\\nSAT $satUsed/$satVisible • $level\"'''\nif old_aspect_start\
        \ not in text:\n    raise SystemExit(\"V242: exact verified V238 aspect string not found\")\ntext = text.replace(old_aspect_start,\
        \ new_aspect_start, 1)\nFIELD.write_text(text, encoding=\"utf-8\")\n\n# LUTS top-left, ASPECT top-right.\ntext = ADAPT.read_text(encoding=\"\
        utf-8\")\ntext, n1 = re.subn(\n    r'(placeChip\\(\\s*FIELD_CHIP_TAG,\\s*start\\s*=\\s*)true(\\s*,)',\n    r'\\1false\\\
        2',\n    text,\n    count=1\n)\ntext, n2 = re.subn(\n    r'(placeChip\\(\\s*GRADE_CHIP_TAG,\\s*start\\s*=\\s*)false(\\\
        s*,)',\n    r'\\1true\\2',\n    text,\n    count=1\n)\ntext, n3 = re.subn(\n    r'lp\\.gravity\\s*=\\s*\\(if \\(start\\\
        ) Gravity\\.START else Gravity\\.END\\) or Gravity\\.CENTER_VERTICAL',\n    'lp.gravity = Gravity.TOP or (if (start)\
        \ Gravity.START else Gravity.END)',\n    text,\n    count=1\n)\ntext, n4 = re.subn(\n    r'lp\\.topMargin\\s*=\\s*0',\n\
        \    'lp.topMargin = dp(if (landscape) 8 else 10)',\n    text,\n    count=1\n)\nif (n1, n2, n3, n4) != (1, 1, 1, 1):\n\
        \    raise SystemExit(f\"V242 adaptive patch counts: {(n1,n2,n3,n4)}\")\nADAPT.write_text(text, encoding=\"utf-8\"\
        )\n\n# V238 Clean View can hide other HUD, but never LUTS or ASPECT.\ntext = OP.read_text(encoding=\"utf-8\")\ntext,\
        \ n5 = re.subn(\n    r'(root\\.findViewWithTag<View>\\(FIELD_CHIP_TAG\\)\\?\\.let\\s*\\{\\s*)fieldBaseline\\s*=\\\
        s*it\\.visibility\\s*it\\.visibility\\s*=\\s*View\\.GONE(\\s*\\})',\n    r'\\1fieldBaseline = View.VISIBLE\\n    \
        \                it.visibility = View.VISIBLE\\2',\n    text,\n    count=1\n)\ntext, n6 = re.subn(\n    r'(root\\\
        .findViewWithTag<View>\\(GRADE_CHIP_TAG\\)\\?\\.let\\s*\\{\\s*)gradeBaseline\\s*=\\s*it\\.visibility\\s*it\\.visibility\\\
        s*=\\s*View\\.GONE(\\s*\\})',\n    r'\\1gradeBaseline = View.VISIBLE\\n                    it.visibility = View.VISIBLE\\\
        2',\n    text,\n    count=1\n)\n\n# Move SHOT READY away from top-right.\ntext, n7 = re.subn(\n    r'gravity\\s*=\\\
        s*Gravity\\.TOP or Gravity\\.END\\s*\\n\\s*topMargin\\s*=\\s*dp\\(7\\)\\s*\\n\\s*rightMargin\\s*=\\s*dp\\(8\\)',\n\
        \    'gravity = Gravity.END or Gravity.CENTER_VERTICAL\\n                    topMargin = 0\\n                    rightMargin\
        \ = dp(8)',\n    text,\n    count=1\n)\nif (n5, n6, n7) != (1, 1, 1):\n    raise SystemExit(f\"V242 operator patch\
        \ counts: {(n5,n6,n7)}\")\nOP.write_text(text, encoding=\"utf-8\")\n\n# Cinema-oriented initial defaults. Existing\
        \ user controls can change them.\ncamera = CAMERA.read_text(encoding=\"utf-8\")\ncamera = camera.replace(\n    \"\
        private var sceneIndex = 0\",\n    \"private var sceneIndex = 2\",\n    1\n)\ncamera = camera.replace(\n    \"private\
        \ var qualityIndex = 0\",\n    \"private var qualityIndex = 2\",\n    1\n)\ncamera = camera.replace(\n    \"private\
        \ var reportPresetIndex = 0\",\n    \"private var reportPresetIndex = 5\",\n    1\n)\nCAMERA.write_text(camera, encoding=\"\
        utf-8\")\n\nprint(\"PASS: dfv238 working format + V242 cinema defaults applied.\")\nPY\n"
