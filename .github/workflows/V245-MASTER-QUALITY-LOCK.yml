        \n            for (i in 0..10) {\n                val y = bottom - range * (i / 10f)\n                val majorTick\
        \ = i % 5 == 0\n                val len = if (majorTick) dp(11) else dp(5)\n\n                canvas.drawLine(\n \
        \                   cx - len,\n                    y,\n                    cx + dp(2),\n                    y,\n \
        \                   if (majorTick) majorPaint else finePaint\n                )\n            }\n\n            val\
        \ markerY = bottom - range * normalized\n\n            canvas.drawLine(\n                dp(4).toFloat(),\n      \
        \          markerY,\n                width - dp(4).toFloat(),\n                markerY,\n                majorPaint\n\
        \            )\n\n            canvas.drawText(\n                String.format(java.util.Locale.US, \"%.1f×\", maximum),\n\
        \                cx,\n                dp(14).toFloat(),\n                labelPaint\n            )\n\n           \
        \ canvas.drawText(\n                String.format(java.util.Locale.US, \"%.1f×\", minimum),\n                cx,\n\
        \                height - dp(7).toFloat(),\n                labelPaint\n            )\n\n            canvas.drawText(\n\
        \                String.format(java.util.Locale.US, \"%.1f×\", current),\n                cx,\n                (markerY\
        \ - dp(5))\n                    .coerceIn(\n                        dp(23).toFloat(),\n                        height\
        \ - dp(24).toFloat()\n                    ),\n                labelPaint\n            )\n        }\n\n        override\
        \ fun onTouchEvent(event: MotionEvent): Boolean {\n            when (event.actionMasked) {\n                MotionEvent.ACTION_DOWN,\n\
        \                MotionEvent.ACTION_MOVE -> {\n                    val top = dp(24).toFloat()\n                  \
        \  val bottom = height - dp(24).toFloat()\n                    val usable = (bottom - top).coerceAtLeast(1f)\n\n \
        \                   val next =\n                        (1f - ((event.y - top) / usable))\n                      \
        \      .coerceIn(0f, 1f)\n\n                    val oldBucket =\n                        (normalized * 4f).roundToInt()\n\
        \                    val newBucket =\n                        (next * 4f).roundToInt()\n\n                    normalized\
        \ = next\n                    cameraActivity.v242SetZoomNormalized(next)\n\n                    if (oldBucket != newBucket)\
        \ {\n                        performHapticFeedback(\n                            HapticFeedbackConstants.CLOCK_TICK\n\
        \                        )\n                    }\n\n                    syncFromSeek()\n                    return\
        \ true\n                }\n\n                MotionEvent.ACTION_UP,\n                MotionEvent.ACTION_CANCEL ->\
        \ {\n                    performClick()\n                    return true\n                }\n            }\n\n   \
        \         return super.onTouchEvent(event)\n        }\n\n        override fun performClick(): Boolean {\n        \
        \    super.performClick()\n            return true\n        }\n\n        private fun dp(value: Int): Int =\n     \
        \       (value * resources.displayMetrics.density).toInt()\n    }\n}\nKOTLIN\n"
