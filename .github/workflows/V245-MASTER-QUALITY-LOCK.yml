    - name: Add V245 Master Quality Lock
      run: |
        set -e
        python3 - <<'PY'
        from pathlib import Path
        import re

        src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
        camera_path = src / "DevelopUgandaCameraActivity.kt"
        home_path = src / "DevelopUgandaGeneralHubActivity.kt"
        story_path = src / "DevelopUgandaStoryPackager.kt"
        gradle_path = Path("v172-source/app/build.gradle.kts")

        camera = camera_path.read_text(encoding="utf-8")

        # Re-apply MASTER UHD/CINEMA on every camera launch.
        old_guard = '''        if (migration.getBoolean("master_initialized", false)) {
            return
        }

'''
        if old_guard in camera:
            camera = camera.replace(
                old_guard,
                '''        // V245 MASTER QUALITY LOCK:
        // re-apply the cinema master on every new camera launch.

''',
                1
            )

        master_anchor = '''        qualityModes.indexOf("MASTER UHD")
            .takeIf { it >= 0 }
            ?.let { qualityIndex = it }
'''
        if master_anchor not in camera:
            raise SystemExit("V245: MASTER UHD startup anchor missing")

        # Keep the normal QUALITY button in the master family only.
        quality_cycle_pattern = re.compile(
            r'(?P<indent>[ \t]*)qualityIndex\s*=\s*'
            r'\(\s*qualityIndex\s*\+\s*1\s*\)\s*%\s*qualityModes\.size'
        )

        def master_cycle(match):
            indent = match.group("indent")
            return (
                f'{indent}val v245MasterModes = '
                'listOf("MASTER UHD", "UHD 60", "MASTER HDR")\n'
                f'{indent}val v245CurrentName = '
                'qualityModes.getOrNull(qualityIndex) ?: "MASTER UHD"\n'
                f'{indent}val v245Current = '
                'v245MasterModes.indexOf(v245CurrentName).takeIf { it >= 0 } ?: 0\n'
                f'{indent}val v245Next = '
                'v245MasterModes[(v245Current + 1) % v245MasterModes.size]\n'
                f'{indent}qualityIndex = '
                'qualityModes.indexOf(v245Next).takeIf { it >= 0 } ?: qualityIndex'
            )

        camera, cycle_count = quality_cycle_pattern.subn(
            master_cycle,
            camera,
            count=1
        )

        if cycle_count == 0:
            print("NOTE: quality cycle pattern not found; startup lock remains active.")

        # Make the operator status unmistakable.
        camera = camera.replace(
            'return "${qualityDeckLabel()} • ${fps}FPS • $shutter • $iso • WB $wb • $focus"',
            'return "MASTER LOCK • ${qualityDeckLabel()} • ${fps}FPS • $shutter • $iso • WB $wb • $focus"',
            1
        )

        # Strengthen the actual finalized Gallery-file verification.
        camera = camera.replace(
            '"SAVED $resolutionLabel • FALLBACK"',
            '"MASTER WARNING • $resolutionLabel FALLBACK"',
            1
        )
        camera = camera.replace(
            '"SAVED $resolutionLabel ✓"',
            '"MASTER VERIFIED • $resolutionLabel ✓"',
            1
        )
        camera = camera.replace(
            '"GALLERY MASTER • ${width}×${height} • ${mbps} Mbps"',
            '"MASTER FILE • ${width}×${height} • ${mbps} Mbps"',
            1
        )

        method_anchor = "    private fun enforceImmersiveCameraWindow() {\n"
        v245_methods = r'''    internal fun v245MasterQualityStatus(): String {
        val name =
            qualityModes.getOrNull(qualityIndex)
                ?: "MASTER UHD"

        return if (
            name == "MASTER UHD" ||
            name == "UHD 60" ||
            name == "MASTER HDR"
        ) {
            "MASTER QUALITY LOCK • $name"
        } else {
            "MASTER QUALITY WARNING • $name"
        }
    }

'''
        if "internal fun v245MasterQualityStatus()" not in camera:
            if method_anchor not in camera:
                raise SystemExit("V245: method anchor missing")
            camera = camera.replace(
                method_anchor,
                v245_methods + method_anchor,
                1
            )

        camera = camera.replace('"V244"', '"V245"')
        camera = camera.replace(' • V244"', ' • V245"')
        camera_path.write_text(camera, encoding="utf-8")

        home = home_path.read_text(encoding="utf-8")
        home = home.replace(
            "develop.uganda • V244",
            "develop.uganda • V245"
        )
        home = home.replace(
            "GENERAL WORKFLOW HOME • CINEMA CONTROL PRO",
            "GENERAL WORKFLOW HOME • MASTER QUALITY LOCK"
        )
        home_path.write_text(home, encoding="utf-8")

        story = story_path.read_text(encoding="utf-8")
        story = story.replace(
            '.put("app_version", "V244")',
            '.put("app_version", "V245")'
        )
        story_path.write_text(story, encoding="utf-8")

        gradle = gradle_path.read_text(encoding="utf-8")
        gradle = gradle.replace(
            "versionCode = 24400",
            "versionCode = 24500",
            1
        )
        gradle = gradle.replace(
            'versionName = "244.0-cinema-control-pro"',
            'versionName = "245.0-master-quality-lock"',
            1
        )
        gradle_path.write_text(gradle, encoding="utf-8")

        print("PASS: V245 Master Quality Lock applied.")
        print("QUALITY button master-cycle patch count:", cycle_count)
        PY

        CAMERA="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
        HOME="v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
        GRADLE="v172-source/app/build.gradle.kts"

        grep -q 'MASTER QUALITY LOCK' "$CAMERA"
        grep -q 'MASTER VERIFIED' "$CAMERA"
        grep -q 'MASTER WARNING' "$CAMERA"
        grep -q 'v245MasterQualityStatus' "$CAMERA"
        grep -q 'develop.uganda • V245' "$HOME"
        grep -q 'versionCode = 24500' "$GRADLE"
        grep -q 'versionName = "245.0-master-quality-lock"' "$GRADLE"
        grep -q 'verifyV242GalleryMaster' "$CAMERA"
        grep -q 'DevelopUgandaV244CinemaControl.attach' "$CAMERA"
        grep -q 'v242SetZoomNormalized' "$CAMERA"

        echo "PASS: V245 verified before Android compilation."

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Build V245 APK
      working-directory: v172-source
      run: 'set -o pipefail

        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v245-build.log

        '
    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: "grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)'\
        \ \\\n  v245-build.log | head -5000 || true\n"
    - name: Prepare V245 artifacts
      run: "cp v172-source/app/build/outputs/apk/debug/app-debug.apk \\\n  DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK.apk\n\n\
        cd v172-source\nzip -qr ../DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK-SOURCE.zip app\ncd ..\n"
    - name: Upload V245 APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK
        path: DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK.apk
        if-no-files-found: error
        retention-days: 14
    - name: Upload V245 source
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK-SOURCE
        path: DEVELOP-UGANDA-V245-MASTER-QUALITY-LOCK-SOURCE.zip
        if-no-files-found: error
        retention-days: 14
    - name: Upload V245 build log if needed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: V245-MASTER-QUALITY-LOCK-BUILD-LOG
        path: v172-source/v245-build.log
        if-no-files-found: warn
        retention-days: 7
