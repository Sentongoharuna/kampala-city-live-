        \ 1f)\n        val span =\n            (state.maxZoomRatio - state.minZoomRatio)\n                .coerceAtLeast(0.001f)\n\
        \n        val ratio =\n            (state.minZoomRatio + span * n)\n                .coerceIn(\n                 \
        \   state.minZoomRatio,\n                    state.maxZoomRatio\n                )\n\n        cam.cameraControl.setZoomRatio(ratio)\n\
        \n        if (::zoomSeek.isInitialized) {\n            zoomSeek.progress =\n                (n * 100f)\n         \
        \           .roundToInt()\n                    .coerceIn(0, 100)\n        }\n    }\n\n    private fun verifyV242GalleryMaster(uri:\
