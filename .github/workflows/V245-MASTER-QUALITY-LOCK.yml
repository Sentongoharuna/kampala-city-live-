        \    val shortSide = minOf(width, height)\n\n                val resolutionLabel =\n                    when {\n \
        \                       longSide >= 7600 && shortSide >= 4000 -> \"8K\"\n                        longSide >= 3800\
        \ && shortSide >= 2000 -> \"4K\"\n                        longSide >= 1900 && shortSide >= 1000 -> \"1080\"\n    \
        \                    longSide >= 1200 -> \"HD\"\n                        else -> \"${width}×${height}\"\n        \
