      - name: Build native V168 APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PULSE-V169-NATIVE-CAMERA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PULSE-V169-NATIVE-CAMERA
          path: PULSE-V169-NATIVE-CAMERA.apk
          archive: false
