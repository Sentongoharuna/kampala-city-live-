      - name: Build native V170 professional camera APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PULSE-V170-PRO-CAMERA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PULSE-V170-PRO-CAMERA
          path: PULSE-V170-PRO-CAMERA.apk
          archive: false
