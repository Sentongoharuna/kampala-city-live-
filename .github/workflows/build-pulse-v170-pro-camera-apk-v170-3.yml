name: Build PULSE V170 Professional Camera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify V170 HTML exists
        run: test -f pulse-live-news-v170-3.html

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Create native Android CameraX wrapper
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sentongoharuna/pulse
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp pulse-live-news-v170-3.html app/src/main/assets/pulse-live-news-v170-3.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'PULSE'
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sentongoharuna.pulse'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.sentongoharuna.pulse'
                  minSdk 26
                  targetSdk 36
                  versionCode 17010
                  versionName '170.1-professional-camera'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.webkit:webkit:1.12.1'

              def camerax_version = '1.4.2'
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-video:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#FFBD18</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.hardware.camera.any" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="PULSE V170"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".NativeCameraActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sentongoharuna/pulse/MainActivity.java <<'EOF'
          package com.sentongoharuna.pulse;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private static final int STARTUP_PERMISSIONS = 100;
              private static final int WEB_PERMISSIONS = 101;
              private static final int GEO_PERMISSIONS = 102;
              private static final int FILE_CHOOSER = 103;
              private static final int NATIVE_CAMERA = 170;
              private static final int SYSTEM_CAMERA_MAIN = 170;

              private WebView webView;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermissionRequest(request));
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {
                          if (hasLocationPermission()) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(new String[] {
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                              }, GEO_PERMISSIONS);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams fileChooserParams) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;
                          try {
                              startActivityForResult(
                                  fileChooserParams.createIntent(),
                                  FILE_CHOOSER
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.addJavascriptInterface(new NativeCameraBridge(), "PulseNativeCamera");

                  requestStartupPermissions();
                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/" +
                      "pulse-live-news-v170-3.html"
                  );
              }

              private class NativeCameraBridge {
                  @JavascriptInterface
                  public void openCamera(String configJson) {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(
                                  MainActivity.this,
                                  NativeCameraActivity.class
                              );
                              i.putExtra("pulse_config", configJson == null ? "{}" : configJson);
                              startActivityForResult(i, NATIVE_CAMERA);
                          } catch (Exception e) {
                              sendCameraError("Android camera could not open: " + e.getMessage());
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean isAvailable() {
                      return getPackageManager().hasSystemFeature(
                          PackageManager.FEATURE_CAMERA_ANY
                      );
                  }

                  @JavascriptInterface
                  public String getCameraStatus() {
                      try {
                          JSONObject o = new JSONObject();
                          boolean hardware = getPackageManager().hasSystemFeature(
                              PackageManager.FEATURE_CAMERA_ANY
                          );
                          o.put("bridge", true);
                          o.put("cameraAvailable", hardware);
                          o.put("cameraPermission",
                              checkSelfPermission(Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED);
                          o.put("microphonePermission",
                              checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  == PackageManager.PERMISSION_GRANTED);
                          o.put("locationPermission", hasLocationPermission());
                          o.put("source", "Android CameraX professional reporter camera");
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"bridge\":true,\"cameraAvailable\":false}";
                      }
                  }

                  @JavascriptInterface
                  public void openAppSettings() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(
                                  Settings.ACTION_APPLICATION_DETAILS_SETTINGS
                              );
                              intent.setData(
                                  Uri.parse("package:" + getPackageName())
                              );
                              startActivity(intent);
                          } catch (Exception e) {
                              sendCameraError("Android app settings could not open");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openSystemCamera() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent =
                                  new Intent(MediaStore.ACTION_VIDEO_CAPTURE);
                              intent.putExtra(MediaStore.EXTRA_VIDEO_QUALITY, 1);
                              startActivityForResult(intent, SYSTEM_CAMERA_MAIN);
                          } catch (Exception e) {
                              sendCameraError("System camera app is unavailable");
                          }
                      });
                  }
              }

              private void requestStartupPermissions() {
                  ArrayList<String> list = new ArrayList<>();

                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      list.add(Manifest.permission.CAMERA);
                  }

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      list.add(Manifest.permission.RECORD_AUDIO);
                  }

                  if (!hasLocationPermission()) {
                      list.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      list.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }

                  if (!list.isEmpty()) {
                      requestPermissions(list.toArray(new String[0]), STARTUP_PERMISSIONS);
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED
                      || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED;
              }

              private void handleWebPermissionRequest(PermissionRequest request) {
                  List<String> allowed = new ArrayList<>();
                  List<String> missing = new ArrayList<>();

                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                          if (checkSelfPermission(Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED) {
                              allowed.add(resource);
                          } else {
                              missing.add(Manifest.permission.CAMERA);
                          }
                      }

                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  == PackageManager.PERMISSION_GRANTED) {
                              allowed.add(resource);
                          } else {
                              missing.add(Manifest.permission.RECORD_AUDIO);
                          }
                      }
                  }

                  if (!missing.isEmpty()) {
                      pendingWebPermission = request;
                      requestPermissions(
                          missing.toArray(new String[0]),
                          WEB_PERMISSIONS
                      );
                  } else if (!allowed.isEmpty()) {
                      request.grant(allowed.toArray(new String[0]));
                  } else {
                      request.deny();
                  }
              }

              private void resolveWebPermission() {
                  if (pendingWebPermission == null) return;

                  List<String> allowed = new ArrayList<>();
                  for (String resource : pendingWebPermission.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED) {
                          allowed.add(resource);
                      }

                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  == PackageManager.PERMISSION_GRANTED) {
                          allowed.add(resource);
                      }
                  }

                  if (!allowed.isEmpty()) {
                      pendingWebPermission.grant(allowed.toArray(new String[0]));
                  } else {
                      pendingWebPermission.deny();
                  }

                  pendingWebPermission = null;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == WEB_PERMISSIONS) {
                      resolveWebPermission();
                  }

                  if (requestCode == GEO_PERMISSIONS && pendingGeoCallback != null) {
                      pendingGeoCallback.invoke(
                          pendingGeoOrigin,
                          hasLocationPermission(),
                          false
                      );
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER && fileCallback != null) {
                      Uri[] result =
                          WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                      return;
                  }

                  if (requestCode == NATIVE_CAMERA) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          String meta = data.getStringExtra("pulse_meta");
                          sendCameraResult(uri == null ? "" : uri.toString(),
                              meta == null ? "{}" : meta);
                      } else if (data != null && data.hasExtra("pulse_error")) {
                          sendCameraError(data.getStringExtra("pulse_error"));
                      }
                      return;
                  }

                  if (requestCode == SYSTEM_CAMERA_MAIN) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();
                          sendCameraResult(
                              uri == null ? "" : uri.toString(),
                              "{\"source\":\"system-camera-fallback\"}"
                          );
                      }
                  }
              }

              private void sendCameraResult(String uri, String meta) {
                  String js =
                      "window.onPulseNativeCameraResult(" +
                      JSONObject.quote(uri) + "," +
                      JSONObject.quote(meta) + ");";
                  webView.evaluateJavascript(js, null);
              }

              private void sendCameraError(String message) {
                  String js =
                      "window.onPulseNativeCameraError(" +
                      JSONObject.quote(message == null ? "Camera error" : message) +
                      ");";
                  webView.evaluateJavascript(js, null);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/sentongoharuna/pulse/NativeCameraActivity.java <<'EOF'
          package com.sentongoharuna.pulse;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.StatFs;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ExposureState;
          import androidx.camera.core.Preview;
          import androidx.camera.core.ZoomState;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.video.FallbackStrategy;
          import androidx.camera.video.FileOutputOptions;
          import androidx.camera.video.MediaStoreOutputOptions;
          import androidx.camera.video.PendingRecording;
          import androidx.camera.video.Quality;
          import androidx.camera.video.QualitySelector;
          import androidx.camera.video.Recorder;
          import androidx.camera.video.Recording;
          import androidx.camera.video.VideoCapture;
          import androidx.camera.video.VideoRecordEvent;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;

          import org.json.JSONObject;

          import java.io.File;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutionException;

          public class NativeCameraActivity extends AppCompatActivity {

              private static final int CAMERA_PERMISSIONS = 200;
              private static final int SYSTEM_CAMERA = 201;

              private PreviewView previewView;
              private TextView statusView;
              private TextView telemetryView;
              private TextView timecodeView;
              private TextView formatView;
              private TextView lensView;
              private TextView audioView;

              private Button recButton;
              private Button flipButton;
              private Button torchButton;
              private Button isoButton;
              private Button shutterButton;
              private Button wbButton;
              private Button tintButton;
              private Button focusButton;

              private SeekBar zoomSeek;
              private SeekBar exposureSeek;

              private ProcessCameraProvider cameraProvider;
              private Camera camera;
              private VideoCapture<Recorder> videoCapture;
              private Recording recording;

              private boolean useFront = false;
              private boolean torchOn = false;
              private boolean wantMic = true;
              private boolean returnToPreviousApp = true;

              private String resolution = "4K";
              private int fps = 30;
              private String codec = "HEVC";
              private String hdr = "10-bit HDR target";
              private String lensRequest = "Wide";
              private String stabilization = "Standard";
              private String lut = "Neutral";
              private int iso = 400;
              private int shutterAngle = 180;
              private int kelvin = 5600;
              private int tint = 0;
              private int focusPercent = 50;
              private int exposureComp = 0;
              private int audioGainDb = 0;
              private String configJson = "{}";

              private final Handler timerHandler = new Handler(Looper.getMainLooper());
              private long recordingStartedAt = 0L;

              private final Runnable timecodeTick = new Runnable() {
                  @Override
                  public void run() {
                      updateTimecode();
                      timerHandler.postDelayed(this, 250);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(
                      android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  configJson = getIntent().getStringExtra("pulse_config");
                  if (configJson == null) configJson = "{}";
                  parseConfig(configJson);

                  buildUi();

                  if (hasCameraPermission()) {
                      startCamera();
                  } else {
                      requestPermissions(new String[] {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      }, CAMERA_PERMISSIONS);
                  }

                  timerHandler.post(timecodeTick);
              }

              private void parseConfig(String json) {
                  try {
                      JSONObject o = new JSONObject(json);

                      lensRequest = o.optString("lens", "Wide");
                      useFront = "Front".equalsIgnoreCase(lensRequest);

                      resolution = o.optString("resolution", "4K");
                      fps = o.optInt("fps", 30);
                      codec = o.optString("codec", "HEVC");
                      hdr = o.optString("hdr", "10-bit HDR target");
                      stabilization = o.optString("stabilization", "Standard");
                      lut = o.optString("lut", "Neutral");

                      iso = o.optInt("iso", 400);
                      shutterAngle = o.optInt("shutterAngle", 180);
                      kelvin = o.optInt("whiteBalanceKelvin", 5600);
                      tint = o.optInt("tint", 0);
                      focusPercent = o.optInt("focusPercent", 50);
                      exposureComp = o.optInt("exposureCompensation", 0);
                      audioGainDb = o.optInt("audioGainDb", 0);

                      wantMic = o.optBoolean("microphone", true);
                      returnToPreviousApp =
                          o.optBoolean("returnToPreviousApp", true);
                  } catch (Exception ignored) {}
              }

              private void buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  previewView = new PreviewView(this);
                  previewView.setImplementationMode(
                      PreviewView.ImplementationMode.COMPATIBLE
                  );
                  root.addView(
                      previewView,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  // Top broadcast HUD.
                  LinearLayout topHud = new LinearLayout(this);
                  topHud.setOrientation(LinearLayout.VERTICAL);
                  topHud.setPadding(14, 10, 14, 8);
                  topHud.setBackgroundColor(0xB5000000);

                  TextView brand = hudText(
                      "PULSE PRO CAMERA  •  BROADCAST REPORTER",
                      13,
                      0xFF7CEBFF
                  );
                  topHud.addView(brand);

                  LinearLayout topRow = horizontalRow();
                  statusView = hudText("REC STBY", 11, 0xFFFFD86B);
                  timecodeView = hudText("TC 00:00:00", 11, Color.WHITE);
                  formatView = hudText(
                      resolution + "  " + fps + "FPS  " + codec,
                      10,
                      Color.WHITE
                  );

                  topRow.addView(statusView, weightParams());
                  topRow.addView(timecodeView, weightParams());
                  topRow.addView(formatView, weightParams());
                  topHud.addView(topRow);

                  telemetryView = hudText(
                      "GPS --  •  BAT --  •  STORAGE --",
                      9,
                      0xFFD7E8EC
                  );
                  topHud.addView(telemetryView);

                  FrameLayout.LayoutParams topParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                  topParams.gravity = Gravity.TOP;
                  root.addView(topHud, topParams);

                  // Manual parameter strip.
                  LinearLayout manual = horizontalRow();
                  manual.setPadding(6, 2, 6, 2);
                  manual.setBackgroundColor(0xAA071016);

                  isoButton = makeMiniButton("ISO\n" + iso);
                  shutterButton = makeMiniButton("SHUTTER\n" + shutterAngle + "°");
                  wbButton = makeMiniButton("WB\n" + kelvin + "K");
                  tintButton = makeMiniButton("TINT\n" + tint);
                  focusButton = makeMiniButton("FOCUS\n" + focusPercent + "%");

                  manual.addView(isoButton, weightParams());
                  manual.addView(shutterButton, weightParams());
                  manual.addView(wbButton, weightParams());
                  manual.addView(tintButton, weightParams());
                  manual.addView(focusButton, weightParams());

                  FrameLayout.LayoutParams manualParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                  manualParams.gravity = Gravity.TOP;
                  manualParams.topMargin = dp(92);
                  root.addView(manual, manualParams);

                  isoButton.setOnClickListener(v -> cycleIso());
                  shutterButton.setOnClickListener(v -> cycleShutter());
                  wbButton.setOnClickListener(v -> cycleWhiteBalance());
                  tintButton.setOnClickListener(v -> cycleTint());
                  focusButton.setOnClickListener(v -> cycleFocus());

                  // Monitoring strip requested by the reporter camera specification.
                  LinearLayout scopes = horizontalRow();
                  scopes.setPadding(6, 3, 6, 3);
                  scopes.setBackgroundColor(0x7A000000);

                  scopes.addView(scopeLabel("PEAK"), weightParams());
                  scopes.addView(scopeLabel("ZEBRA"), weightParams());
                  scopes.addView(scopeLabel("FALSE"), weightParams());
                  scopes.addView(scopeLabel("WAVE"), weightParams());
                  scopes.addView(scopeLabel("HIST"), weightParams());
                  scopes.addView(scopeLabel("LUT " + shortText(lut, 8)), weightParams());

                  FrameLayout.LayoutParams scopeParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                  scopeParams.gravity = Gravity.TOP;
                  scopeParams.topMargin = dp(150);
                  root.addView(scopes, scopeParams);

                  // Bottom professional control stack.
                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setOrientation(LinearLayout.VERTICAL);
                  bottom.setPadding(10, 6, 10, 12);
                  bottom.setBackgroundColor(0xD0000000);

                  LinearLayout infoRow = horizontalRow();
                  lensView = hudText(
                      "LENS " + lensRequest.toUpperCase(Locale.US),
                      9,
                      0xFF7CEBFF
                  );
                  audioView = hudText(
                      wantMic ? "MIC ON  GAIN " + audioGainDb + "dB" : "MIC OFF",
                      9,
                      Color.WHITE
                  );
                  TextView hdrView = hudText(
                      shortText(hdr, 18),
                      9,
                      0xFFFFD86B
                  );
                  infoRow.addView(lensView, weightParams());
                  infoRow.addView(audioView, weightParams());
                  infoRow.addView(hdrView, weightParams());
                  bottom.addView(infoRow);

                  LinearLayout zoomRow = horizontalRow();
                  TextView zoomLabel = hudText("ZOOM", 9, Color.WHITE);
                  zoomSeek = new SeekBar(this);
                  zoomSeek.setMax(100);
                  zoomSeek.setProgress(0);
                  zoomRow.addView(zoomLabel, new LinearLayout.LayoutParams(dp(58), dp(38)));
                  zoomRow.addView(
                      zoomSeek,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(38),
                          1f
                      )
                  );
                  bottom.addView(zoomRow);

                  LinearLayout expRow = horizontalRow();
                  TextView expLabel = hudText("EXPOSURE", 9, Color.WHITE);
                  exposureSeek = new SeekBar(this);
                  exposureSeek.setMax(12);
                  exposureSeek.setProgress(6);
                  expRow.addView(expLabel, new LinearLayout.LayoutParams(dp(72), dp(38)));
                  expRow.addView(
                      exposureSeek,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(38),
                          1f
                      )
                  );
                  bottom.addView(expRow);

                  LinearLayout actions = horizontalRow();
                  Button closeButton = makeButton("CLOSE");
                  flipButton = makeButton("LENS");
                  torchButton = makeButton("TORCH");
                  Button phoneButton = makeButton("PHONE");
                  recButton = makeButton("● REC");
                  recButton.setTextColor(0xFFFF453A);

                  actions.addView(closeButton, weightParams());
                  actions.addView(flipButton, weightParams());
                  actions.addView(torchButton, weightParams());
                  actions.addView(phoneButton, weightParams());
                  actions.addView(recButton, weightParams());
                  bottom.addView(actions);

                  FrameLayout.LayoutParams bottomParams =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                  bottomParams.gravity = Gravity.BOTTOM;
                  root.addView(bottom, bottomParams);

                  closeButton.setOnClickListener(v -> finishCamera());
                  flipButton.setOnClickListener(v -> flipCamera());
                  torchButton.setOnClickListener(v -> toggleTorch());
                  phoneButton.setOnClickListener(v -> launchSamsungCamera());
                  recButton.setOnClickListener(v -> toggleRecording());

                  zoomSeek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                                  SeekBar seekBar,
                                  int progress,
                                  boolean fromUser) {
                              if (fromUser) applyZoom(progress);
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar seekBar) {}

                          @Override
                          public void onStopTrackingTouch(SeekBar seekBar) {}
                      }
                  );

                  exposureSeek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                                  SeekBar seekBar,
                                  int progress,
                                  boolean fromUser) {
                              if (fromUser) applyExposure(progress - 6);
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar seekBar) {}

                          @Override
                          public void onStopTrackingTouch(SeekBar seekBar) {}
                      }
                  );

                  setContentView(root);
                  refreshDeviceTelemetry();
              }

              private LinearLayout horizontalRow() {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  return row;
              }

              private TextView hudText(String text, float sp, int color) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(sp);
                  v.setTextColor(color);
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  v.setPadding(5, 4, 5, 4);
                  return v;
              }

              private TextView scopeLabel(String text) {
                  TextView v = hudText(text, 7, 0xFF8EA7AD);
                  v.setGravity(Gravity.CENTER);
                  return v;
              }

              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(9);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setMinHeight(dp(42));
                  return b;
              }

              private Button makeMiniButton(String text) {
                  Button b = makeButton(text);
                  b.setTextSize(8);
                  b.setTextColor(0xFFE7FBFF);
                  return b;
              }

              private LinearLayout.LayoutParams weightParams() {
                  return new LinearLayout.LayoutParams(
                      0,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      1f
                  );
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density
                  );
              }

              private String shortText(String value, int max) {
                  if (value == null) return "";
                  return value.length() <= max
                      ? value
                      : value.substring(0, max);
              }

              private void cycleIso() {
                  int[] values = {100, 200, 400, 800, 1600, 3200};
                  iso = nextValue(values, iso);
                  isoButton.setText("ISO\n" + iso);
                  Toast.makeText(
                      this,
                      "ISO target " + iso +
                          " • exact sensor control depends on Camera2 support",
                      Toast.LENGTH_SHORT
                  ).show();
              }

              private void cycleShutter() {
                  int[] values = {45, 90, 180, 360};
                  shutterAngle = nextValue(values, shutterAngle);
                  shutterButton.setText("SHUTTER\n" + shutterAngle + "°");
              }

              private void cycleWhiteBalance() {
                  int[] values = {3200, 4300, 5600, 6500, 7500};
                  kelvin = nextValue(values, kelvin);
                  wbButton.setText("WB\n" + kelvin + "K");
              }

              private void cycleTint() {
                  int[] values = {-20, -10, 0, 10, 20};
                  tint = nextValue(values, tint);
                  tintButton.setText("TINT\n" + tint);
              }

              private void cycleFocus() {
                  int[] values = {0, 25, 50, 75, 100};
                  focusPercent = nextValue(values, focusPercent);
                  focusButton.setText(
                      focusPercent == 0
                          ? "FOCUS\nAUTO"
                          : "FOCUS\n" + focusPercent + "%"
                  );
              }

              private int nextValue(int[] values, int current) {
                  for (int i = 0; i < values.length; i++) {
                      if (values[i] == current) {
                          return values[(i + 1) % values.length];
                      }
                  }
                  return values[0];
              }

              private boolean hasCameraPermission() {
                  return checkSelfPermission(Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED;
              }

              private boolean hasMicPermission() {
                  return checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED;
              }

              private void startCamera() {
                  statusView.setText("CAMERA OPENING");
                  ListenableFuture<ProcessCameraProvider> future =
                      ProcessCameraProvider.getInstance(this);

                  future.addListener(() -> {
                      try {
                          cameraProvider = future.get();
                          bindCamera();
                      } catch (ExecutionException | InterruptedException e) {
                          cameraFailure("CameraX could not start");
                      } catch (Exception e) {
                          cameraFailure("Camera could not bind");
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private QualitySelector buildQualitySelector() {
                  List<Quality> ordered;

                  if ("4K".equalsIgnoreCase(resolution)) {
                      ordered = Arrays.asList(
                          Quality.UHD,
                          Quality.FHD,
                          Quality.HD
                      );
                  } else if ("720p".equalsIgnoreCase(resolution)) {
                      ordered = Arrays.asList(
                          Quality.HD,
                          Quality.SD
                      );
                  } else {
                      ordered = Arrays.asList(
                          Quality.FHD,
                          Quality.HD,
                          Quality.UHD
                      );
                  }

                  return QualitySelector.fromOrderedList(
                      ordered,
                      FallbackStrategy.lowerQualityOrHigherThan(Quality.HD)
                  );
              }

              private void bindCamera() {
                  if (cameraProvider == null) return;

                  cameraProvider.unbindAll();

                  Preview preview = new Preview.Builder().build();
                  preview.setSurfaceProvider(
                      previewView.getSurfaceProvider()
                  );

                  Recorder recorder = new Recorder.Builder()
                      .setQualitySelector(buildQualitySelector())
                      .build();

                  videoCapture = VideoCapture.withOutput(recorder);

                  CameraSelector selector = useFront
                      ? CameraSelector.DEFAULT_FRONT_CAMERA
                      : CameraSelector.DEFAULT_BACK_CAMERA;

                  try {
                      camera = cameraProvider.bindToLifecycle(
                          this,
                          selector,
                          preview,
                          videoCapture
                      );

                      torchOn = false;
                      torchButton.setText("TORCH");

                      formatView.setText(
                          resolution + "  " + fps + "FPS  " + codec
                      );
                      lensView.setText(
                          "LENS " +
                          (useFront ? "FRONT" : lensRequest.toUpperCase(Locale.US))
                      );
                      statusView.setText("REC STBY");

                      syncZoomRange();
                      syncExposureRange();
                      refreshDeviceTelemetry();
                  } catch (Exception e) {
                      cameraFailure("Selected camera is unavailable");
                  }
              }

              private void syncZoomRange() {
                  if (camera == null) return;
                  ZoomState state =
                      camera.getCameraInfo().getZoomState().getValue();
                  if (state == null) return;

                  float min = state.getMinZoomRatio();
                  float max = state.getMaxZoomRatio();
                  float current = state.getZoomRatio();

                  int progress = 0;
                  if (max > min) {
                      progress = Math.round(
                          ((current - min) / (max - min)) * 100f
                      );
                  }
                  zoomSeek.setProgress(
                      Math.max(0, Math.min(100, progress))
                  );
              }

              private void syncExposureRange() {
                  if (camera == null) return;
                  ExposureState state =
                      camera.getCameraInfo().getExposureState();

                  if (!state.isExposureCompensationSupported()) {
                      exposureSeek.setEnabled(false);
                      return;
                  }

                  exposureSeek.setEnabled(true);
                  exposureComp =
                      state.getExposureCompensationIndex();

                  int progress = Math.max(
                      0,
                      Math.min(12, exposureComp + 6)
                  );
                  exposureSeek.setProgress(progress);
              }

              private void applyZoom(int progress) {
                  if (camera == null) return;

                  ZoomState state =
                      camera.getCameraInfo().getZoomState().getValue();
                  if (state == null) return;

                  float min = state.getMinZoomRatio();
                  float max = state.getMaxZoomRatio();
                  float ratio =
                      min + ((max - min) * (progress / 100f));

                  camera.getCameraControl().setZoomRatio(ratio);
              }

              private void applyExposure(int requested) {
                  if (camera == null) return;

                  ExposureState state =
                      camera.getCameraInfo().getExposureState();

                  if (!state.isExposureCompensationSupported()) {
                      return;
                  }

                  int lower =
                      state.getExposureCompensationRange().getLower();
                  int upper =
                      state.getExposureCompensationRange().getUpper();

                  int value =
                      Math.max(lower, Math.min(upper, requested));

                  exposureComp = value;
                  camera.getCameraControl()
                      .setExposureCompensationIndex(value);
              }

              private void flipCamera() {
                  if (recording != null) {
                      Toast.makeText(
                          this,
                          "Stop recording before switching lens",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }
                  useFront = !useFront;
                  bindCamera();
              }

              private void toggleTorch() {
                  if (camera == null
                          || !camera.getCameraInfo().hasFlashUnit()
                          || useFront) {
                      Toast.makeText(
                          this,
                          "Torch is not available on this lens",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  torchOn = !torchOn;
                  camera.getCameraControl().enableTorch(torchOn);
                  torchButton.setText(
                      torchOn ? "TORCH ON" : "TORCH"
                  );
              }

              private MediaStoreOutputOptions createMediaStoreOutputOptions() {
                  String name =
                      "PULSE_V170_" + System.currentTimeMillis();

                  ContentValues values = new ContentValues();
                  values.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      name
                  );
                  values.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          "Movies/PULSE"
                      );
                  }

                  return new MediaStoreOutputOptions.Builder(
                      getContentResolver(),
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  )
                  .setContentValues(values)
                  .build();
              }

              private FileOutputOptions createFileOutputOptions() {
                  String name =
                      "PULSE_V170_" + System.currentTimeMillis();

                  File dir = getExternalFilesDir("PULSE");
                  if (dir != null && !dir.exists()) dir.mkdirs();

                  File file = new File(
                      dir == null ? getFilesDir() : dir,
                      name + ".mp4"
                  );

                  return new FileOutputOptions.Builder(file).build();
              }

              private void toggleRecording() {
                  if (videoCapture == null) {
                      Toast.makeText(
                          this,
                          "Camera is still starting",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  if (recording != null) {
                      recording.stop();
                      return;
                  }

                  try {
                      PendingRecording pending;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          pending = videoCapture.getOutput()
                              .prepareRecording(
                                  this,
                                  createMediaStoreOutputOptions()
                              );
                      } else {
                          pending = videoCapture.getOutput()
                              .prepareRecording(
                                  this,
                                  createFileOutputOptions()
                              );
                      }

                      if (wantMic && hasMicPermission()) {
                          pending = pending.withAudioEnabled();
                      }

                      recording = pending.start(
                          ContextCompat.getMainExecutor(this),
                          event -> {
                              if (event instanceof VideoRecordEvent.Start) {
                                  recordingStartedAt =
                                      System.currentTimeMillis();

                                  statusView.setText("● REC LIVE");
                                  statusView.setTextColor(
                                      0xFFFF453A
                                  );
                                  recButton.setText("■ STOP");
                                  refreshDeviceTelemetry();
                              }

                              if (event instanceof VideoRecordEvent.Finalize) {
                                  VideoRecordEvent.Finalize fin =
                                      (VideoRecordEvent.Finalize) event;

                                  recording = null;
                                  recordingStartedAt = 0L;
                                  recButton.setText("● REC");
                                  statusView.setTextColor(
                                      0xFFFFD86B
                                  );

                                  if (fin.hasError()) {
                                      statusView.setText(
                                          "RECORDING ERROR • TRY PHONE"
                                      );
                                      Toast.makeText(
                                          this,
                                          "Native recording failed",
                                          Toast.LENGTH_LONG
                                      ).show();
                                      return;
                                  }

                                  Uri uri =
                                      fin.getOutputResults()
                                          .getOutputUri();

                                  statusView.setText(
                                      "SAVED • PULSE"
                                  );

                                  Intent data = new Intent();
                                  data.setData(uri);
                                  data.putExtra(
                                      "pulse_meta",
                                      buildResultMetadata()
                                  );
                                  setResult(
                                      Activity.RESULT_OK,
                                      data
                                  );

                                  if (returnToPreviousApp) {
                                      finish();
                                  }
                              }
                          }
                      );
                  } catch (Exception e) {
                      cameraFailure(
                          "Recording could not start"
                      );
                  }
              }

              private String buildResultMetadata() {
                  try {
                      JSONObject o = new JSONObject(configJson);
                      o.put("actualCameraPath", "Android CameraX");
                      o.put("exposureCompensation", exposureComp);
                      o.put("isoTarget", iso);
                      o.put("shutterAngleTarget", shutterAngle);
                      o.put("whiteBalanceKelvinTarget", kelvin);
                      o.put("tintTarget", tint);
                      o.put("focusTargetPercent", focusPercent);
                      o.put("lutPreview", lut);
                      return o.toString();
                  } catch (Exception e) {
                      return configJson;
                  }
              }

              private void updateTimecode() {
                  long ms = recordingStartedAt == 0L
                      ? 0L
                      : System.currentTimeMillis()
                          - recordingStartedAt;

                  long totalSeconds = ms / 1000L;
                  long h = totalSeconds / 3600L;
                  long m = (totalSeconds % 3600L) / 60L;
                  long s = totalSeconds % 60L;

                  timecodeView.setText(
                      String.format(
                          Locale.US,
                          "TC %02d:%02d:%02d",
                          h,
                          m,
                          s
                      )
                  );
              }

              private void refreshDeviceTelemetry() {
                  String battery = "--";
                  String storage = "--";
                  String gps = "--";

                  try {
                      BatteryManager bm =
                          (BatteryManager) getSystemService(
                              BATTERY_SERVICE
                          );
                      int level = bm.getIntProperty(
                          BatteryManager.BATTERY_PROPERTY_CAPACITY
                      );
                      if (level >= 0) battery = level + "%";
                  } catch (Exception ignored) {}

                  try {
                      StatFs stat = new StatFs(
                          Environment
                              .getExternalStorageDirectory()
                              .getPath()
                      );
                      long free =
                          stat.getAvailableBytes()
                              / (1024L * 1024L * 1024L);
                      storage = free + "GB";
                  } catch (Exception ignored) {}

                  if (checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                      ) == PackageManager.PERMISSION_GRANTED
                      || checkSelfPermission(
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      ) == PackageManager.PERMISSION_GRANTED) {

                      try {
                          LocationManager lm =
                              (LocationManager) getSystemService(
                                  LOCATION_SERVICE
                              );

                          Location l =
                              lm.getLastKnownLocation(
                                  LocationManager.GPS_PROVIDER
                              );

                          if (l == null) {
                              l = lm.getLastKnownLocation(
                                  LocationManager.NETWORK_PROVIDER
                              );
                          }

                          if (l != null) {
                              gps = String.format(
                                  Locale.US,
                                  "%.5f %.5f",
                                  l.getLatitude(),
                                  l.getLongitude()
                              );
                          }
                      } catch (Exception ignored) {}
                  }

                  telemetryView.setText(
                      "GPS " + gps +
                      "  •  BAT " + battery +
                      "  •  FREE " + storage +
                      "  •  STAB " + shortText(
                          stabilization,
                          10
                      )
                  );

                  audioView.setText(
                      wantMic
                          ? "MIC ON  GAIN " + audioGainDb + "dB"
                          : "MIC OFF"
                  );
              }

              private void launchSamsungCamera() {
                  try {
                      Intent intent =
                          new Intent(
                              MediaStore.ACTION_VIDEO_CAPTURE
                          );

                      intent.putExtra(
                          MediaStore.EXTRA_VIDEO_QUALITY,
                          1
                      );

                      startActivityForResult(
                          intent,
                          SYSTEM_CAMERA
                      );
                  } catch (Exception e) {
                      cameraFailure(
                          "Phone camera app is unavailable"
                      );
                  }
              }

              private void cameraFailure(String message) {
                  statusView.setText(
                      message + " • OPENING PHONE CAMERA"
                  );
                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_LONG
                  ).show();

                  previewView.postDelayed(
                      this::launchSamsungCamera,
                      350
                  );
              }

              private void finishCamera() {
                  if (recording != null) {
                      recording.stop();
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == SYSTEM_CAMERA) {
                      if (resultCode == Activity.RESULT_OK) {
                          Uri uri =
                              data == null
                                  ? null
                                  : data.getData();

                          Intent result = new Intent();
                          result.setData(uri);
                          result.putExtra(
                              "pulse_meta",
                              buildResultMetadata()
                          );
                          setResult(
                              Activity.RESULT_OK,
                              result
                          );
                          finish();
                      } else {
                          statusView.setText("REC STBY");
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == CAMERA_PERMISSIONS) {
                      if (hasCameraPermission()) {
                          startCamera();
                      } else {
                          Intent result = new Intent();
                          result.putExtra(
                              "pulse_error",
                              "Camera permission was denied. Allow Camera in Android Settings."
                          );
                          setResult(
                              Activity.RESULT_CANCELED,
                              result
                          );
                          finish();
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  timerHandler.removeCallbacksAndMessages(null);

                  if (recording != null) {
                      try {
                          recording.stop();
                      } catch (Exception ignored) {}
                      recording = null;
                  }

                  if (cameraProvider != null) {
                      try {
                          cameraProvider.unbindAll();
                      } catch (Exception ignored) {}
                  }

                  super.onDestroy();
              }
          }
