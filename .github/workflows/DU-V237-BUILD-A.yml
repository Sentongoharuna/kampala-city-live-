name: Build develop.uganda V237 Adaptive UI A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/DU-V237-BUILD-A.yml'
      - 'DU-V237-ADAPTIVE-A.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V236 or V237 base
        run: |
          set -e
          PATCH="DU-V237-ADAPTIVE-A.py"
          GRADLE="v172-source/app/build.gradle.kts"
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"

          test -f "$PATCH"
          python3 -m py_compile "$PATCH"
          test -f "$GRADLE"
          test -f "$SRC/DevelopUgandaFieldIntelligencePanel.kt"
          test -f "$SRC/DevelopUgandaEverydayColorMixer.kt"
          test -f "$SRC/DevelopUgandaLiveGradePanel.kt"

          if grep -q 'versionCode = 23700' "$GRADLE"; then
            echo "PASS: V237 already applied; rebuilding safely."
          elif grep -q 'versionCode = 23600' "$GRADLE"; then
            echo "PASS: V236 multi-format satellite base found."
          else
            echo "Unsupported base version:"
            grep -E 'versionCode|versionName' "$GRADLE" || true
            exit 1
          fi

      - name: Lock V235 color systems
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          protected = [
              "DevelopUgandaColorEngine.kt",
              "DevelopUgandaColorTuner.kt",
              "DevelopUgandaEverydayColorMixer.kt",
              "DevelopUgandaLiveGradePanel.kt",
              "DevelopUgandaNavySheet.kt",
          ]
          data = {}
          for name in protected:
              path = src / name
              if not path.exists():
                  raise SystemExit(f"Protected V235 color file missing: {name}")
              data[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("/tmp/v237-v235-color-lock.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8"
          )
          print("PASS: V235 LUT/color fingerprints saved.")
          PY

      - name: Apply V237 Adaptive UI A
        run: |
          set -e
          python3 DU-V237-ADAPTIVE-A.py

      - name: Prove V235 LUT systems unchanged
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          before = json.loads(
              Path("/tmp/v237-v235-color-lock.json").read_text(encoding="utf-8")
          )
          for name, expected in before.items():
              actual = hashlib.sha256((src / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"V235 protected color system changed: {name}")
          print("PASS: V235 LUT engine, mixer and live grade UI retained exactly.")
          PY

      - name: Verify V237 adaptive implementation
        run: |
          set -e
          SRC="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          ADAPT="$SRC/DevelopUgandaAdaptiveFormatUi.kt"
          CAMERA="$SRC/DevelopUgandaCameraActivity.kt"
          LIVE="$SRC/DevelopUgandaLiveActivity.kt"
          FIELD="$SRC/DevelopUgandaFieldIntelligencePanel.kt"
          GRADLE="v172-source/app/build.gradle.kts"

          test -f "$ADAPT"
          grep -q 'YOUTUBE_16_9' "$ADAPT"
          grep -q 'CINEMA_239' "$ADAPT"
          grep -q 'DUAL_SAFE' "$ADAPT"
          grep -q 'INSTAGRAM_4_5' "$ADAPT"
          grep -q 'SQUARE_1_1' "$ADAPT"
          grep -q 'v237_camera_deck' "$CAMERA"
          grep -q 'v237_camera_mode_row' "$CAMERA"
          grep -q 'Role.REPORT' "$CAMERA"
          grep -q 'v237_live_deck' "$LIVE"
          grep -q 'Role.LIVE' "$LIVE"
          grep -q 'activeFormatId' "$FIELD"
          grep -q 'versionCode = 23700' "$GRADLE"
          grep -q 'versionName = "237.0-adaptive-multiformat-ui"' "$GRADLE"
          grep -q '"V237"' "$CAMERA"
          grep -q '"V237"' "$LIVE"
          echo "PASS: V237 adaptive YouTube/Cinema/Dual/portrait layouts verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V237 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v237-build.log

      - name: Print useful compiler errors
        if: failure()
        working-directory: v172-source
        run: |
          echo "========== V237 IMPORTANT BUILD ERRORS =========="
          grep -Ein \
            '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' \
            v237-build.log \
            | head -5000 \
            || true

      - name: Commit V237 only after successful APK build
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app \
            README-V237-ADAPTIVE-MULTIFORMAT-UI.txt

          if git diff --cached --quiet; then
            echo "V237 source already committed."
          else
            git commit -m "Add develop.uganda V237 adaptive multi-format UI"
            git push
          fi

      - name: Prepare V237 APK
        run: |
          set -e
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V237-ADAPTIVE-UI-A.apk
          cd v172-source
          zip -qr ../DEVELOP-UGANDA-V237-ADAPTIVE-UI-A-SOURCE.zip app
          cd ..
          ls -lh DEVELOP-UGANDA-V237-ADAPTIVE-UI-A.apk DEVELOP-UGANDA-V237-ADAPTIVE-UI-A-SOURCE.zip

      - name: Upload V237 APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V237-ADAPTIVE-UI-A
          path: DEVELOP-UGANDA-V237-ADAPTIVE-UI-A.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload V237 source
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V237-ADAPTIVE-UI-A-SOURCE
          path: DEVELOP-UGANDA-V237-ADAPTIVE-UI-A-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload V237 build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V237-ADAPTIVE-UI-A-BUILD-LOG
          path: v172-source/v237-build.log
          if-no-files-found: warn
          retention-days: 7
