name: Build develop.uganda V189 Smart Operator Pro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V189 source bundle
        run: |
          set -e
          test -f DEVELOP-UGANDA-V189-SMART-OPERATOR-PRO-SOURCE.zip
          test -d v172-source
          echo "V189 source bundle found"

      - name: Install V189 source
        run: |
          set -e
          rm -rf /tmp/develop-v189
          mkdir -p /tmp/develop-v189

          unzip -q \
            DEVELOP-UGANDA-V189-SMART-OPERATOR-PRO-SOURCE.zip \
            -d /tmp/develop-v189

          cp -R /tmp/develop-v189/app/. \
            v172-source/app/

      - name: Verify V189 requested features
        run: |
          set -e

          BASE="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          REPORT="$BASE/DevelopUgandaCameraActivity.kt"
          LIVE="$BASE/DevelopUgandaLiveActivity.kt"
          EDIT="$BASE/DevelopUgandaEditorActivity.kt"
          HOME="$BASE/DevelopUgandaNewsroomActivity.kt"

          # Preserve V187/V188 foundations.
          grep -q 'previewNarrationPanel' "$REPORT"
          grep -q 'MessageDigest.getInstance' "$REPORT"
          grep -q 'runCountdownStep' "$LIVE"

          # V189 REPORT.
          grep -q 'ACTION_CLEAN' "$REPORT"
          grep -q 'toggleReportCleanMode' "$REPORT"
          grep -q 'recordingHealthText' "$REPORT"
          grep -q 'SWIPE ZOOM/EXP' "$REPORT"
          grep -q 'setZoomRatio' "$REPORT"
          grep -q 'applyAdaptiveReportPreviewTypography' "$REPORT"

          # V189 LIVE health.
          grep -q 'liveAudioAmplitude' "$LIVE"
          grep -q 'HEALTH' "$LIVE"

          # V189 EDIT.
          grep -q 'MUTE + SAVE' "$EDIT"
          grep -q 'includeAudio = false' "$EDIT"
          grep -q 'develop_uganda_edit_uri' "$EDIT"

          # V189 HOME.
          grep -q 'RECENT CLIPS' "$HOME"
          grep -q 'recentClipCard' "$HOME"
          grep -q 'ContentUris.withAppendedId' "$HOME"

          grep -q 'versionCode = 18900' \
            v172-source/app/build.gradle.kts

          echo "V189 Smart Operator Pro features verified"

      - name: Commit V189 actual source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt \
            v172-source/app/src/main/AndroidManifest.xml \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V189 source already committed"
          else
            git commit -m "Add develop.uganda V189 Smart Operator Pro"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V189 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v189-build.log

      - name: Print exact compiler error and source context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v189-build.log \
            | head -520 \
            || true

          echo "===== FIRST KOTLIN SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v189-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          m = re.search(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          filename = m.group(1)
          line_no = int(m.group(2))

          matches = list(
              Path("app/src/main/java").rglob(filename)
          )

          if not matches:
              print("Source file not found:", filename)
              raise SystemExit(0)

          lines = matches[0].read_text(
              encoding="utf-8"
          ).splitlines()

          for n in range(
              max(1, line_no - 18),
              min(len(lines), line_no + 28) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V189-SMART-OPERATOR-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V189-SMART-OPERATOR-PRO
          path: DEVELOP-UGANDA-V189-SMART-OPERATOR-PRO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V189-BUILD-LOG
          path: v172-source/v189-build.log
          if-no-files-found: warn
          retention-days: 7
