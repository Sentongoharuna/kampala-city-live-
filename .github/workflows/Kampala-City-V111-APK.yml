name: Build Kampala City V111 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kampalacity/live app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'KampalaCity'
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.kampalacity.live'
            compileSdk 35
            defaultConfig {
              applicationId 'com.kampalacity.live'
              minSdk 24
              targetSdk 35
              versionCode 111
              versionName '1.11.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOT
          cat > app/src/main/res/values/strings.xml <<'EOT'
          <resources><string name="app_name">Kampala City</string></resources>
          EOT
          cat > app/src/main/res/values/styles.xml <<'EOT'
          <resources><style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">true</item><item name="android:statusBarColor">#F5EFE7</item><item name="android:navigationBarColor">#F5EFE7</item></style></resources>
          EOT
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOT'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#7F5242" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#F5EFE7" android:pathData="M16,16h76v76h-76z"/><path android:fillColor="#7F5242" android:pathData="M35,28h38v52h-38z"/></vector>
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:icon="@drawable/ic_launcher" android:label="@string/app_name" android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOT
          cat > app/src/main/java/com/kampalacity/live/MainActivity.java <<'EOT'
          package com.kampalacity.live;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*; import android.graphics.Color;
          public class MainActivity extends Activity {
            WebView webView;
            public void onCreate(Bundle b){super.onCreate(b); webView=new WebView(this); setContentView(webView); WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); webView.setWebViewClient(new WebViewClient()); webView.setWebChromeClient(new WebChromeClient()); webView.loadUrl("https://airy-ghostbit-6m4kn7d.shipstatic.com");}
            public void onBackPressed(){if(webView.canGoBack()) webView.goBack(); else super.onBackPressed();}
          }
          EOT
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kampala-City-V111.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kampala-City-V111-APK
          path: Kampala-City-V111.apk
