              private void startCamera() {
                  statusView.setText("CAMERA OPENING");

                  ListenableFuture<ProcessCameraProvider> future =
                      ProcessCameraProvider.getInstance(this);

                  future.addListener(() -> {
                      try {
                          cameraProvider = future.get();
                          bindCamera();
                      } catch (ExecutionException | InterruptedException e) {
                          cameraFailure("CameraX could not start");
                      } catch (Exception e) {
                          cameraFailure("Camera could not bind");
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private QualitySelector buildQualitySelector() {
                  List<Quality> ordered;

                  if ("4K".equalsIgnoreCase(resolution)) {
                      ordered = Arrays.asList(
                          Quality.UHD,
                          Quality.FHD,
                          Quality.HD
                      );
                  } else if ("720p".equalsIgnoreCase(resolution)) {
                      ordered = Arrays.asList(
                          Quality.HD,
                          Quality.SD
                      );
                  } else {
                      ordered = Arrays.asList(
                          Quality.FHD,
                          Quality.HD,
                          Quality.UHD
                      );
                  }

                  return QualitySelector.fromOrderedList(
                      ordered,
                      FallbackStrategy.lowerQualityOrHigherThan(Quality.HD)
                  );
              }

              private void bindCamera() {
                  if (cameraProvider == null) return;

                  cameraProvider.unbindAll();

                  Preview preview = new Preview.Builder().build();
                  preview.setSurfaceProvider(
                      previewView.getSurfaceProvider()
                  );

                  Recorder recorder = new Recorder.Builder()
                      .setQualitySelector(buildQualitySelector())
                      .build();

                  videoCapture = VideoCapture.withOutput(recorder);

                  CameraSelector selector = useFront
                      ? CameraSelector.DEFAULT_FRONT_CAMERA
                      : CameraSelector.DEFAULT_BACK_CAMERA;

                  try {
                      closeOverlayEffect();

                      SessionConfig.Builder session =
                          new SessionConfig.Builder(
                              Arrays.asList(preview, videoCapture)
                          );

                      if (burnOverlay) {
                          overlayEffect = new OverlayEffect(
                              CameraEffect.PREVIEW | CameraEffect.VIDEO_CAPTURE,
                              0,
                              new Handler(Looper.getMainLooper()),
                              throwable -> runOnUiThread(() ->
                                  Toast.makeText(
                                      this,
                                      "PULSE overlay fallback: " +
                                          throwable.getMessage(),
                                      Toast.LENGTH_SHORT
                                  ).show()
                              )
                          );

                          overlayEffect.setOnDrawListener(frame -> {
                              drawBurnedNewsOverlay(frame);
                              return true;
                          });

                          session.addEffect(overlayEffect);
                      }

                      camera = cameraProvider.bindToLifecycle(
                          this,
                          selector,
                          session.build()
                      );

                      torchOn = false;
                      torchButton.setText("TORCH");
                      formatView.setText(
                          resolution + " • " + fps + "FPS • " + codec
                      );
                      statusView.setText("● REC STBY");

                      syncZoomRange();
                      syncExposureRange();
                      refreshLocationUi();
                      refreshDeviceTelemetry();
                  } catch (Exception e) {
                      cameraFailure(
                          "Selected professional camera mode is unavailable"
                      );
                  }
              }

              private void drawBurnedNewsOverlay(Frame frame) {
                  try {
                      Canvas c = frame.getOverlayCanvas();
                      c.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR);

                      android.graphics.Rect crop = frame.getCropRect();
                      float left = crop.left;
                      float top = crop.top;
                      float right = crop.right;
                      float bottom = crop.bottom;
                      float w = crop.width();
                      float h = crop.height();
                      float unit = Math.max(1f, Math.min(w, h) / 1000f);

                      Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                      Paint text = new Paint(Paint.ANTI_ALIAS_FLAG);
                      text.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);

                      // PULSE LIVE / BREAKING masthead.
                      fill.setColor(0xE6FF2D20);
                      c.drawRoundRect(
                          left + 26*unit,
                          top + 26*unit,
                          left + 240*unit,
                          top + 92*unit,
                          16*unit,
                          16*unit,
                          fill
                      );
                      text.setColor(Color.WHITE);
                      text.setTextSize(34*unit);
                      c.drawText(
                          "● PULSE LIVE",
                          left + 45*unit,
                          top + 69*unit,
                          text
                      );

                      if (!"Minimal".equalsIgnoreCase(overlayPreset)) {
                          fill.setColor(0xD9000000);
                          c.drawRoundRect(
                              left + 255*unit,
                              top + 26*unit,
                              left + 470*unit,
                              top + 92*unit,
                              16*unit,
                              16*unit,
                              fill
                          );
                          text.setColor(
                              "Breaking".equalsIgnoreCase(overlayPreset)
                                  ? 0xFFFFD24A
                                  : 0xFF7CEBFF
                          );
                          text.setTextSize(30*unit);
                          c.drawText(
                              overlayPreset.toUpperCase(Locale.US),
                              left + 275*unit,
                              top + 68*unit,
                              text
                          );
                      }

                      // Clock / recording time.
                      text.setColor(Color.WHITE);
                      text.setTextSize(25*unit);
                      text.setTextAlign(Paint.Align.RIGHT);
                      String tc = showTimecode
                          ? ("TC " + currentTimecode())
                          : "";
                      c.drawText(
                          clockFormat.format(new Date()) + "  " + tc,
                          right - 30*unit,
                          top + 64*unit,
                          text
                      );
                      text.setTextAlign(Paint.Align.LEFT);

                      // Lower third.
                      float lowerTop = bottom - 205*unit;
                      fill.setColor(0xD9000000);
                      c.drawRoundRect(
                          left + 26*unit,
                          lowerTop,
                          right - 26*unit,
                          bottom - 30*unit,
                          18*unit,
                          18*unit,
                          fill
                      );

                      text.setColor(0xFF7CEBFF);
                      text.setTextSize(27*unit);
                      c.drawText(
                          reporterName + "  •  " + sourceLabel,
                          left + 52*unit,
                          lowerTop + 42*unit,
                          text
                      );

                      text.setColor(Color.WHITE);
                      text.setTextSize(40*unit);
                      c.drawText(
                          shortText(headline, 55),
                          left + 52*unit,
                          lowerTop + 92*unit,
                          text
                      );

                      text.setTextSize(24*unit);
                      text.setColor(0xFFD6E9ED);
                      c.drawText(
                          overlayLocationLine(),
                          left + 52*unit,
                          lowerTop + 132*unit,
                          text
                      );

                      text.setColor(0xFF9FB9BE);
                      c.drawText(
                          overlayTelemetryLine(),
                          left + 52*unit,
                          lowerTop + 166*unit,
                          text
                      );

                      // Recording indicator baked into exported frames.
                      if (recording != null) {
                          fill.setColor(0xEEFF2D20);
                          c.drawCircle(
                              right - 53*unit,
                              bottom - 61*unit,
                              15*unit,
                              fill
                          );
                          text.setTextAlign(Paint.Align.RIGHT);
                          text.setColor(Color.WHITE);
                          text.setTextSize(25*unit);
                          c.drawText(
                              "REC",
                              right - 78*unit,
                              bottom - 52*unit,
                              text
                          );
                          text.setTextAlign(Paint.Align.LEFT);
                      }

                  } catch (Exception ignored) {}
              }

              private String overlayLocationLine() {
                  StringBuilder s = new StringBuilder();

                  if (currentLocationName != null
                          && !currentLocationName.isEmpty()) {
                      s.append(currentLocationName);
                  } else {
                      s.append("PHONE LOCATION");
                  }

                  if (showCoordinates
                          && !Double.isNaN(currentLat)
                          && !Double.isNaN(currentLon)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  •  LAT %.5f  LON %.5f",
                              currentLat,
                              currentLon
                          )
                      );
                  }

                  if (showAltitude && !Double.isNaN(currentAlt)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  ALT %.0fm",
                              currentAlt
                          )
                      );
                  }

                  if (showAltitude && !Float.isNaN(currentAcc)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  ACC %.0fm",
                              currentAcc
                          )
                      );
                  }

                  return s.toString();
              }

              private String overlayTelemetryLine() {
                  StringBuilder s = new StringBuilder();

                  if (showSpeedHeading && !Float.isNaN(currentSpeed)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "SPD %.1f km/h",
                              currentSpeed * 3.6f
                          )
                      );
                  }

                  if (showSpeedHeading && !Float.isNaN(currentHeading)) {
                      if (s.length() > 0) s.append("  •  ");
                      s.append(
                          String.format(
                              Locale.US,
                              "HDG %.0f°",
                              currentHeading
                          )
                      );
                  }

                  if (showBattery && batteryPercent >= 0) {
                      if (s.length() > 0) s.append("  •  ");
                      s.append("BAT ").append(batteryPercent).append("%");
                  }

                  if (showStorage && freeStorageGb >= 0) {
                      if (s.length() > 0) s.append("  •  ");
                      s.append("FREE ").append(freeStorageGb).append("GB");
                  }

                  if (showWeather && weatherText != null
                          && !weatherText.isEmpty()) {
                      if (s.length() > 0) s.append("  •  ");
                      s.append(weatherText);
                  }

                  return s.toString();
              }

              private void closeOverlayEffect() {
                  if (overlayEffect != null) {
                      try {
                          overlayEffect.close();
                      } catch (Exception ignored) {}
                      overlayEffect = null;
                  }
              }

              private void startAutomaticLocation() {
                  if (!autoPhoneLocation || !hasLocationPermission()) {
                      currentLocationName = hasLocationPermission()
                          ? "Automatic GPS off"
                          : "Location permission needed";
                      refreshLocationUi();
                      return;
                  }

                  try {
                      locationManager =
                          (LocationManager) getSystemService(
                              LOCATION_SERVICE
                          );

                      Location last = null;
                      try {
                          last = locationManager.getLastKnownLocation(
                              LocationManager.GPS_PROVIDER
                          );
                      } catch (Exception ignored) {}

                      if (last == null) {
                          try {
                              last = locationManager.getLastKnownLocation(
                                  LocationManager.NETWORK_PROVIDER
                              );
                          } catch (Exception ignored) {}
                      }

                      if (last != null) {
                          locationListener.onLocationChanged(last);
                      }

                      try {
                          locationManager.requestLocationUpdates(
                              LocationManager.GPS_PROVIDER,
                              1000L,
                              0f,
                              locationListener,
                              Looper.getMainLooper()
                          );
                      } catch (Exception ignored) {}

                      try {
                          locationManager.requestLocationUpdates(
                              LocationManager.NETWORK_PROVIDER,
                              1500L,
                              0f,
                              locationListener,
                              Looper.getMainLooper()
                          );
                      } catch (Exception ignored) {}

                  } catch (Exception e) {
                      currentLocationName = "Phone location unavailable";
                      refreshLocationUi();
                  }
              }

              private void reverseGeocode(double lat, double lon) {
                  new Thread(() -> {
                      try {
                          Geocoder g =
                              new Geocoder(
                                  NativeCameraActivity.this,
                                  Locale.getDefault()
                              );

                          List<Address> list =
                              g.getFromLocation(lat, lon, 1);

                          if (list != null && !list.isEmpty()) {
                              Address a = list.get(0);
                              StringBuilder name = new StringBuilder();

                              if (a.getSubLocality() != null) {
                                  name.append(a.getSubLocality());
                              }
                              if (a.getLocality() != null) {
                                  if (name.length() > 0) name.append(", ");
                                  name.append(a.getLocality());
                              }
                              if (a.getAdminArea() != null
                                      && !a.getAdminArea().equals(a.getLocality())) {
                                  if (name.length() > 0) name.append(", ");
                                  name.append(a.getAdminArea());
                              }

                              if (name.length() > 0) {
                                  currentLocationName = name.toString();
                              } else {
                                  currentLocationName = "Phone GPS locked";
                              }
                              runOnUiThread(this::refreshLocationUi);
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void refreshLocationUi() {
                  if (locationView == null) return;

                  StringBuilder s = new StringBuilder();
                  s.append(currentLocationName == null
                      ? "Phone location"
                      : currentLocationName);

                  if (!Double.isNaN(currentLat)
                          && !Double.isNaN(currentLon)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  •  %.5f, %.5f",
                              currentLat,
                              currentLon
                          )
                      );
                  }

                  if (!Double.isNaN(currentAlt)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  •  ALT %.0fm",
                              currentAlt
                          )
                      );
                  }

                  if (!Float.isNaN(currentAcc)) {
                      s.append(
                          String.format(
                              Locale.US,
                              "  •  ±%.0fm",
                              currentAcc
                          )
                      );
                  }

                  locationView.setText(s.toString());
              }

              private void refreshDeviceTelemetry() {
                  try {
                      BatteryManager bm =
                          (BatteryManager) getSystemService(
                              BATTERY_SERVICE
                          );
                      batteryPercent = bm.getIntProperty(
                          BatteryManager.BATTERY_PROPERTY_CAPACITY
                      );
                  } catch (Exception ignored) {}

                  try {
                      StatFs stat = new StatFs(
                          Environment
                              .getExternalStorageDirectory()
                              .getPath()
                      );
                      freeStorageGb =
                          stat.getAvailableBytes()
                              / (1024L * 1024L * 1024L);
                  } catch (Exception ignored) {}

                  if (telemetryView != null) {
                      telemetryView.setText(
                          overlayTelemetryLine()
                      );
                  }
              }

              private void updateTimecode() {
                  if (timecodeView == null) return;

                  timecodeView.setText(
                      "TC " + currentTimecode()
                  );
              }

              private String currentTimecode() {
                  long ms = recordingStartedAt == 0L
                      ? 0L
                      : System.currentTimeMillis()
                          - recordingStartedAt;

                  long total = ms / 1000L;
                  long h = total / 3600L;
                  long m = (total % 3600L) / 60L;
                  long s = total % 60L;

                  return String.format(
                      Locale.US,
                      "%02d:%02d:%02d",
                      h,
                      m,
                      s
                  );
              }

              private void cyclePreset() {
                  String[] values = {
                      "Breaking", "Live", "Clean News", "Minimal"
                  };
                  int idx = 0;
                  for (int i = 0; i < values.length; i++) {
                      if (values[i].equalsIgnoreCase(overlayPreset)) {
                          idx = (i + 1) % values.length;
                          break;
                      }
                  }
                  overlayPreset = values[idx];
                  presetButton.setText(
                      overlayPreset.toUpperCase(Locale.US)
                  );
              }

              private void cycleIso() {
                  int[] values = {100, 200, 400, 800, 1600, 3200};
                  iso = nextValue(values, iso);
                  isoButton.setText("ISO\n" + iso);
              }

              private void cycleShutter() {
                  int[] values = {45, 90, 180, 360};
                  shutterAngle = nextValue(values, shutterAngle);
                  shutterButton.setText(
                      "SHUTTER\n" + shutterAngle + "°"
                  );
              }

              private void cycleWhiteBalance() {
                  int[] values = {3200, 4300, 5600, 6500, 7500};
                  kelvin = nextValue(values, kelvin);
                  wbButton.setText("WB\n" + kelvin + "K");
              }

              private void cycleTint() {
                  int[] values = {-20, -10, 0, 10, 20};
                  tint = nextValue(values, tint);
                  tintButton.setText("TINT\n" + tint);
              }

              private void cycleFocus() {
                  int[] values = {0, 25, 50, 75, 100};
                  focusPercent = nextValue(values, focusPercent);
                  focusButton.setText(
                      focusPercent == 0
                          ? "FOCUS\nAUTO"
                          : "FOCUS\n" + focusPercent + "%"
                  );
              }

              private int nextValue(int[] values, int current) {
                  for (int i = 0; i < values.length; i++) {
                      if (values[i] == current) {
                          return values[(i + 1) % values.length];
                      }
                  }
                  return values[0];
              }

              private void syncZoomRange() {
                  if (camera == null) return;

                  ZoomState state =
                      camera.getCameraInfo().getZoomState().getValue();

                  if (state == null) return;

                  float min = state.getMinZoomRatio();
                  float max = state.getMaxZoomRatio();
                  float current = state.getZoomRatio();

                  int progress = 0;
                  if (max > min) {
                      progress = Math.round(
                          ((current - min) / (max - min)) * 100f
                      );
                  }
                  zoomSeek.setProgress(
                      Math.max(0, Math.min(100, progress))
                  );
              }

              private void applyZoom(int progress) {
                  if (camera == null) return;

                  ZoomState state =
                      camera.getCameraInfo().getZoomState().getValue();

                  if (state == null) return;

                  float min = state.getMinZoomRatio();
                  float max = state.getMaxZoomRatio();
                  float ratio =
                      min + ((max - min) * (progress / 100f));

                  camera.getCameraControl().setZoomRatio(ratio);
              }

              private void syncExposureRange() {
                  if (camera == null) return;

                  ExposureState state =
                      camera.getCameraInfo().getExposureState();

                  if (!state.isExposureCompensationSupported()) {
                      exposureSeek.setEnabled(false);
                      return;
                  }

                  exposureSeek.setEnabled(true);
                  exposureComp = state.getExposureCompensationIndex();

                  int progress = Math.max(
                      0,
                      Math.min(12, exposureComp + 6)
                  );
                  exposureSeek.setProgress(progress);
              }

              private void applyExposure(int requested) {
                  if (camera == null) return;

                  ExposureState state =
                      camera.getCameraInfo().getExposureState();

                  if (!state.isExposureCompensationSupported()) {
                      return;
                  }

                  int lower =
                      state.getExposureCompensationRange().getLower();
                  int upper =
                      state.getExposureCompensationRange().getUpper();

                  int value =
                      Math.max(lower, Math.min(upper, requested));

                  exposureComp = value;
                  camera.getCameraControl()
                      .setExposureCompensationIndex(value);
              }

              private void flipCamera() {
                  if (recording != null) {
                      Toast.makeText(
                          this,
                          "Stop recording before switching lens",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  useFront = !useFront;
                  bindCamera();
              }

              private void toggleTorch() {
                  if (camera == null
                          || !camera.getCameraInfo().hasFlashUnit()
                          || useFront) {
                      Toast.makeText(
                          this,
                          "Torch is not available on this lens",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  torchOn = !torchOn;
                  camera.getCameraControl().enableTorch(torchOn);
                  torchButton.setText(
                      torchOn ? "TORCH ON" : "TORCH"
                  );
              }

              private MediaStoreOutputOptions createMediaStoreOutputOptions() {
                  String name =
                      "PULSE_V171_" + System.currentTimeMillis();

                  ContentValues values = new ContentValues();
                  values.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      name
                  );
                  values.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          "Movies/PULSE"
                      );
                  }

                  return new MediaStoreOutputOptions.Builder(
                      getContentResolver(),
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  )
                  .setContentValues(values)
                  .build();
              }

              private FileOutputOptions createFileOutputOptions() {
                  String name =
                      "PULSE_V171_" + System.currentTimeMillis();

                  File dir = getExternalFilesDir("PULSE");
                  if (dir != null && !dir.exists()) dir.mkdirs();

                  File file = new File(
                      dir == null ? getFilesDir() : dir,
                      name + ".mp4"
                  );

                  return new FileOutputOptions.Builder(file).build();
              }

              private void toggleRecording() {
                  if (videoCapture == null) {
                      Toast.makeText(
                          this,
                          "Camera is still starting",
                          Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  if (recording != null) {
                      recording.stop();
                      return;
                  }

                  try {
                      PendingRecording pending;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          pending = videoCapture.getOutput()
                              .prepareRecording(
                                  this,
                                  createMediaStoreOutputOptions()
                              );
                      } else {
                          pending = videoCapture.getOutput()
                              .prepareRecording(
                                  this,
                                  createFileOutputOptions()
                              );
                      }

                      if (wantMic && hasMicPermission()) {
                          pending = pending.withAudioEnabled();
                      }

                      recording = pending.start(
                          ContextCompat.getMainExecutor(this),
                          event -> {
                              if (event instanceof VideoRecordEvent.Start) {
                                  recordingStartedAt =
                                      System.currentTimeMillis();

                                  statusView.setText("● REC LIVE");
                                  statusView.setTextColor(0xFFFF453A);
                                  recButton.setText("■ STOP");
                              }

                              if (event instanceof VideoRecordEvent.Finalize) {
                                  VideoRecordEvent.Finalize fin =
                                      (VideoRecordEvent.Finalize) event;

                                  recording = null;
                                  recordingStartedAt = 0L;
                                  recButton.setText("● REC");
                                  statusView.setTextColor(0xFFFFD65C);

                                  if (fin.hasError()) {
                                      statusView.setText(
                                          "RECORDING ERROR • TRY PHONE"
                                      );
                                      Toast.makeText(
                                          this,
                                          "Native recording failed",
                                          Toast.LENGTH_LONG
                                      ).show();
                                      return;
                                  }

                                  Uri uri =
                                      fin.getOutputResults()
                                          .getOutputUri();

                                  statusView.setText(
                                      "SAVED TO GALLERY • PULSE"
                                  );

                                  Intent data = new Intent();
                                  data.setData(uri);
                                  data.putExtra(
                                      "pulse_meta",
                                      buildResultMetadata()
                                  );
                                  setResult(
                                      Activity.RESULT_OK,
                                      data
                                  );

                                  Toast.makeText(
                                      this,
                                      burnOverlay
                                          ? "Saved to Gallery with PULSE newsroom graphics"
                                          : "Saved to Gallery",
                                      Toast.LENGTH_LONG
                                  ).show();

                                  if (returnToPreviousApp) {
                                      finish();
                                  }
                              }
                          }
                      );

                  } catch (Exception e) {
                      cameraFailure(
                          "Recording could not start"
                      );
                  }
              }

              private String buildResultMetadata() {
                  try {
                      JSONObject o = new JSONObject(configJson);
                      o.put("actualCameraPath", "Android CameraX V171");
                      o.put("galleryExport", true);
                      o.put("burnedNewsOverlay", burnOverlay);
                      o.put("overlayPreset", overlayPreset);
                      o.put("locationName", currentLocationName);
                      o.put("latitude", currentLat);
                      o.put("longitude", currentLon);
                      o.put("altitude", currentAlt);
                      o.put("accuracy", currentAcc);
                      o.put("speed", currentSpeed);
                      o.put("heading", currentHeading);
                      o.put("batteryPercent", batteryPercent);
                      o.put("freeStorageGb", freeStorageGb);
                      o.put("weatherText", weatherText);
                      return o.toString();
                  } catch (Exception e) {
                      return configJson;
                  }
              }

              private void launchSamsungCamera() {
                  try {
                      Intent intent =
                          new Intent(
                              MediaStore.ACTION_VIDEO_CAPTURE
                          );

                      intent.putExtra(
                          MediaStore.EXTRA_VIDEO_QUALITY,
                          1
                      );

                      startActivityForResult(
                          intent,
                          SYSTEM_CAMERA
                      );
                  } catch (Exception e) {
                      cameraFailure(
                          "Phone camera app is unavailable"
                      );
                  }
              }

              private void cameraFailure(String message) {
                  statusView.setText(
                      message + " • OPENING PHONE CAMERA"
                  );
                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_LONG
                  ).show();

                  previewView.postDelayed(
                      this::launchSamsungCamera,
                      350
                  );
              }

              private void finishCamera() {
                  if (recording != null) {
                      recording.stop();
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == SYSTEM_CAMERA) {
                      if (resultCode == Activity.RESULT_OK) {
                          Uri uri =
                              data == null
                                  ? null
                                  : data.getData();

                          Intent result = new Intent();
                          result.setData(uri);
                          result.putExtra(
                              "pulse_meta",
                              buildResultMetadata()
                          );
                          setResult(
                              Activity.RESULT_OK,
                              result
                          );
                          finish();
                      } else {
                          statusView.setText("● REC STBY");
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == CAMERA_PERMISSIONS) {
                      if (hasCameraPermission()) {
                          startCamera();
                          startAutomaticLocation();
                      } else {
                          Intent result = new Intent();
                          result.putExtra(
                              "pulse_error",
                              "Camera permission was denied. Allow Camera in Android Settings."
                          );
                          setResult(
                              Activity.RESULT_CANCELED,
                              result
                          );
                          finish();
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  uiHandler.removeCallbacksAndMessages(null);

                  if (locationManager != null) {
                      try {
                          locationManager.removeUpdates(locationListener);
                      } catch (Exception ignored) {}
                  }

                  if (recording != null) {
                      try {
                          recording.stop();
                      } catch (Exception ignored) {}
                      recording = null;
                  }

                  closeOverlayEffect();

                  if (cameraProvider != null) {
                      try {
                          cameraProvider.unbindAll();
                      } catch (Exception ignored) {}
                  }

                  super.onDestroy();
              }
          }
