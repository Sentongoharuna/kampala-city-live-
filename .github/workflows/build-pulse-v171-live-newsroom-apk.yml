              private String codec = "HEVC";
              private String hdr = "10-bit HDR target";
              private String lensRequest = "Wide";
              private String stabilization = "Standard";
              private String lut = "Neutral";
              private int iso = 400;
              private int shutterAngle = 180;
              private int kelvin = 5600;
              private int tint = 0;
              private int focusPercent = 50;
              private int exposureComp = 0;
              private int audioGainDb = 0;

              private String overlayPreset = "Breaking";
              private String reporterName = "PULSE REPORTER";
              private String headline = "LIVE FIELD REPORT";
              private String sourceLabel = "PULSE NEWSROOM";
              private String weatherText = "WX --";
              private String configJson = "{}";

              private volatile double currentLat = Double.NaN;
              private volatile double currentLon = Double.NaN;
              private volatile double currentAlt = Double.NaN;
              private volatile float currentAcc = Float.NaN;
              private volatile float currentSpeed = Float.NaN;
              private volatile float currentHeading = Float.NaN;
              private volatile String currentLocationName = "Locating…";
              private volatile int batteryPercent = -1;
              private volatile long freeStorageGb = -1;

              private LocationManager locationManager;
              private final Handler uiHandler = new Handler(Looper.getMainLooper());
              private long recordingStartedAt = 0L;
              private long lastGeocodeAt = 0L;

              private final SimpleDateFormat clockFormat =
                  new SimpleDateFormat("yyyy-MM-dd  HH:mm:ss", Locale.US);

              private final Runnable uiTick = new Runnable() {
                  @Override
                  public void run() {
                      refreshDeviceTelemetry();
                      updateTimecode();
                      uiHandler.postDelayed(this, 1000);
                  }
              };

              private final LocationListener locationListener =
                  new LocationListener() {
                      @Override
                      public void onLocationChanged(@NonNull Location location) {
                          currentLat = location.getLatitude();
                          currentLon = location.getLongitude();
                          currentAlt = location.hasAltitude()
                              ? location.getAltitude()
                              : Double.NaN;
                          currentAcc = location.hasAccuracy()
                              ? location.getAccuracy()
                              : Float.NaN;
                          currentSpeed = location.hasSpeed()
                              ? location.getSpeed()
                              : Float.NaN;
                          currentHeading = location.hasBearing()
                              ? location.getBearing()
                              : Float.NaN;

                          if (System.currentTimeMillis() - lastGeocodeAt > 15000) {
                              lastGeocodeAt = System.currentTimeMillis();
                              reverseGeocode(currentLat, currentLon);
                          }
                          runOnUiThread(() -> refreshLocationUi());
                      }
                  };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(
                      android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  configJson = getIntent().getStringExtra("pulse_config");
                  if (configJson == null) configJson = "{}";
                  parseConfig(configJson);
                  buildUi();

                  if (hasCameraPermission()) {
                      startCamera();
                      startAutomaticLocation();
                  } else {
                      requestPermissions(new String[] {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      }, CAMERA_PERMISSIONS);
                  }

                  uiHandler.post(uiTick);
              }

              private void parseConfig(String json) {
                  try {
                      JSONObject o = new JSONObject(json);

                      lensRequest = o.optString("lens", "Wide");
                      useFront = "Front".equalsIgnoreCase(lensRequest);
                      resolution = o.optString("resolution", "4K");
                      fps = o.optInt("fps", 30);
                      codec = o.optString("codec", "HEVC");
                      hdr = o.optString("hdr", "10-bit HDR target");
                      stabilization = o.optString("stabilization", "Standard");
                      lut = o.optString("lut", "Neutral");

                      iso = o.optInt("iso", 400);
                      shutterAngle = o.optInt("shutterAngle", 180);
                      kelvin = o.optInt("whiteBalanceKelvin", 5600);
                      tint = o.optInt("tint", 0);
                      focusPercent = o.optInt("focusPercent", 50);
                      exposureComp = o.optInt("exposureCompensation", 0);
                      audioGainDb = o.optInt("audioGainDb", 0);

                      wantMic = o.optBoolean("microphone", true);
                      returnToPreviousApp =
                          o.optBoolean("returnToPreviousApp", true);

                      overlayPreset = o.optString("overlayPreset", "Breaking");
                      reporterName = o.optString("reporterName", "PULSE REPORTER");
                      headline = o.optString("headline", "LIVE FIELD REPORT");
                      sourceLabel = o.optString("sourceLabel", "PULSE NEWSROOM");
                      weatherText = o.optString("weatherText", "WX --");

                      burnOverlay = o.optBoolean("burnOverlay", true);
