    - name: Verify V270 function guards
      run: |
        set -e
        grep -q 'versionCode = 27000' v172-source/app/build.gradle.kts
        grep -q 'versionName = "270.0-guided-workflow-verified-actions"' v172-source/app/build.gradle.kts
        grep -q 'GUIDED WORKFLOW • NEXT ACTION' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt
        grep -q 'VERIFY.*ACTIONS' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt
        grep -q 'V270 GUIDANCE + ACTION AUDIT' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt
        grep -q 'showFeature' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV270Guidance.kt
        grep -q 'safeOpen' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV270Guidance.kt
        grep -q 'NO TAKE YET' v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV269SmartStoryDesk.kt
        ! grep -R -q 'setOnClickListener[[:space:]]*{[[:space:]]*}' v172-source/app/src/main/java/com/sentongoharuna/pulse
        ! grep -q 'configure RTMP/SRT endpoint' v172-source/app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt
        ! grep -q 'Media3 editor foundation included' v172-source/app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt
        python3 - <<'PY'
        import re
        from pathlib import Path
        root=Path('v172-source')
        manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
        declared=set(re.findall(r'android:name="\\.([A-Za-z0-9_]+)"',manifest))
        guide=(root/'app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV270Guidance.kt').read_text()
        routes=set(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\\.java',guide))
        missing=sorted(routes-declared)
        if missing:
            raise SystemExit('Missing manifest routes: '+', '.join(missing))
        print(f'PASS: {len(routes)} V270 audited routes are declared.')
        PY
        echo 'PASS: V270 source/function guards verified.'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Build V270 PRO CAM APK
      working-directory: v172-source
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v270-pro-cam-build.log

    - name: Print compiler errors
      if: failure()
      working-directory: v172-source
      run: |
        grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v270-pro-cam-build.log | head -5000 || true

    - name: Prepare V270 PRO CAM artifacts
      run: |
        cp v172-source/app/build/outputs/apk/debug/app-debug.apk DEVELOP-UGANDA-V270-PRO-CAM.apk
        cd v172-source
        zip -qr ../DEVELOP-UGANDA-V270-PRO-CAM-SOURCE.zip app build.gradle.kts settings.gradle.kts gradle.properties -x 'app/build/*'
        cd ..

    - name: Upload V270 PRO CAM APK
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-V270-PRO-CAM
