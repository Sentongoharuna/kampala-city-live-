name: Build develop.uganda V187 Preview Output Separated

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify V187 bundle
        run: |
          set -e
          test -f DEVELOP-UGANDA-V187-PREVIEW-OUTPUT-SEPARATED-SOURCE.zip
          test -d v172-source
          echo "V187 source bundle found"

      - name: Install V187 source
        run: |
          set -e

          rm -rf /tmp/develop-v187
          mkdir -p /tmp/develop-v187

          unzip -q \
            DEVELOP-UGANDA-V187-PREVIEW-OUTPUT-SEPARATED-SOURCE.zip \
            -d /tmp/develop-v187

          cp -R /tmp/develop-v187/app/. \
            v172-source/app/

      - name: Verify V187 preview/output separation
        run: |
          set -e

          BASE="v172-source/app/src/main/java/com/sentongoharuna/pulse"
          REPORT="$BASE/DevelopUgandaCameraActivity.kt"
          LIVE="$BASE/DevelopUgandaLiveActivity.kt"

          grep -q 'previewNarrationPanel' "$REPORT"
          grep -q 'previewBrandView' "$REPORT"
          grep -q 'CameraEffect.IMAGE_CAPTURE' "$REPORT"
          grep -q 'CameraEffect.VIDEO_CAPTURE' "$REPORT"

          if grep -A8 'val effectTargets' "$REPORT" | grep -q 'CameraEffect.PREVIEW'; then
            echo "ERROR: report output overlay still targets PREVIEW"
            exit 1
          fi

          grep -q 'livePreviewMeta' "$LIVE"
          grep -q 'livePreviewTech' "$LIVE"
          grep -q 'OverlayEffect(' "$LIVE"

          if grep -A6 'overlayEffect =' "$LIVE" | grep -q 'CameraEffect.PREVIEW'; then
            echo "ERROR: live output overlay still targets PREVIEW"
            exit 1
          fi

          grep -q 'topMargin =' "$LIVE"
          grep -q 'versionCode = 18700' \
            v172-source/app/build.gradle.kts

          echo "V187 preview narration separated from recorded graphics"

      - name: Commit V187 actual source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt \
            v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt \
            v172-source/app/src/main/AndroidManifest.xml \
            v172-source/app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "V187 source already committed"
          else
            git commit -m "Fix V187 preview narration without changing recorded overlay"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V187 APK
        working-directory: v172-source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v187-build.log

      - name: Print exact compiler error and source context
        if: failure()
        working-directory: v172-source
        run: |
          echo "===== IMPORTANT ERROR LINES ====="
          grep -Ein \
            "(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)" \
            v187-build.log \
            | head -440 \
            || true

          echo "===== FIRST KOTLIN SOURCE CONTEXT ====="
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("v187-build.log").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          m = re.search(
              r'([A-Za-z0-9_]+\.kt):(\d+):(\d+)',
              log
          )

          if not m:
              print("No Kotlin source line found in log.")
              raise SystemExit(0)

          filename = m.group(1)
          line_no = int(m.group(2))

          matches = list(
              Path("app/src/main/java").rglob(filename)
          )

          if not matches:
              print("Source file not found:", filename)
              raise SystemExit(0)

          lines = matches[0].read_text(
              encoding="utf-8"
          ).splitlines()

          for n in range(
              max(1, line_no - 14),
              min(len(lines), line_no + 22) + 1
          ):
              mark = ">>" if n == line_no else "  "
              print(f"{mark} {n:4}: {lines[n-1]}")
          PY

      - name: Prepare APK
        run: |
          cp \
            v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V187-PREVIEW-OUTPUT-SEPARATED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V187-PREVIEW-OUTPUT-SEPARATED
          path: DEVELOP-UGANDA-V187-PREVIEW-OUTPUT-SEPARATED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V187-BUILD-LOG
          path: v172-source/v187-build.log
          if-no-files-found: warn
          retention-days: 7
