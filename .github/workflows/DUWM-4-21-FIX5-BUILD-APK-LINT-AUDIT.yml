name: DUWM 4.21 FIX5 Build APK and Lint Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/DUWM-4-21-FIX5-BUILD-APK-LINT-AUDIT.yml'
      - 'DUWM-1-2-20-4-21-FIX2-SOURCE.tar.gz'

permissions:
  contents: read

concurrency:
  group: duwm-421-fix5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build existing DUWM 4.21 source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm exact frozen source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo 'e6c0222d1d7fc12cae1f939af349aefddb86e44cfc76ffcd2e00169d5ac813d2  DUWM-1-2-20-4-21-FIX2-SOURCE.tar.gz' | sha256sum --check --status
          echo 'Verified the original DUWM 4.21 FIX2 archive.'

      - name: Unpack exact project without importing old changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-21-FIX2-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          PROJECT_DIR="$RUNNER_TEMP/duwm/DUWM-1-2-20-4-21-FIX2-PROJECT"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/scripts/verify-4-21-air.sh"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Verify Android SDK and install supported packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          # Do not install the obsolete Android SDK 'tools' package.
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -d "$SDK_ROOT/platforms/android-36"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify preserved globe and live aircraft code
        shell: bash
        run: |
          set -euo pipefail
          bash "$PROJECT_DIR/scripts/verify-4-21-air.sh" "$PROJECT_DIR"

      - name: Compile and assemble signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Verify APK and stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              corrupt = z.testzip()
              assert corrupt is None, f'Invalid zip entry: {corrupt}'
              names = z.namelist()
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
          print('APK zip contents verified, manifest and classes.dex found')
          PY
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/DUWM-4-21-FIX5-LIVE-AIRCRAFT.apk"
          sha256sum "$RUNNER_TEMP/release/DUWM-4-21-FIX5-LIVE-AIRCRAFT.apk"

      - name: Upload assembled APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-4-21-FIX5-LIVE-AIRCRAFT-APK
          path: ${{ runner.temp }}/release/DUWM-4-21-FIX5-LIVE-AIRCRAFT.apk
          if-no-files-found: error
          retention-days: 30

      # FIX4 compiled but :app:lintDebug failed with 19 errors and 385 warnings.
      # Keep the findings visible WITHOUT claiming that they are resolved or
      # allowing existing source lint findings to block distribution of a built APK.
      - name: Lint audit (report existing issues without blocking APK)
        id: lint_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace

      - name: Publish lint warning in summary
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.lint_audit.outcome }}' = 'failure' ]; then
            {
              echo '### Build completed with unresolved Android lint findings'
              echo 'The APK build and signing check are separate from lint.'
              echo 'Android Lint failed in the original source; do not treat this as a lint-clean or device-tested release.'
              echo 'FIX4 previously reported 19 errors and 385 warnings, including use of ArrayList.sort (API 24) while minSdk was API 23.'
              echo 'Review the lint report artifact before approving wider distribution.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lint report for source repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-4-21-FIX5-LINT-REPORT
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.*
            ${{ env.PROJECT_DIR }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/*.txt
          if-no-files-found: ignore
          retention-days: 30
